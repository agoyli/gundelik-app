<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iki amally meseleler — 1-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .task { background: #fff6e0; border-radius: 13px; padding: 12px 13px; font-size: 16.5px; line-height: 1.65; }
  .short { background: #f7fafd; border-radius: 12px; padding: 11px; font-size: 16px; line-height: 1.9; }
  .short b { display: inline-block; min-width: 26px; }
  .nums { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .nums button { min-height: 46px; font-size: 17px; font-weight: 700; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Iki amally meseleler</h1>
  <div class="sub">Matematika · 1-nji synp</div>

  <div class="card">
    <div class="def">Ilki <b>gysga ýazgy</b> düzülýär, soňra <b>birinji amal</b> näbellini
      tapýar, <b>ikinji amal</b> bolsa soraga jogap berýär.</div>
  </div>

  <div class="card">
    <h3>Meseläniň gysga ýazgysy</h3>
    <div class="task" id="task"></div>
    <div class="short" id="short" style="margin-top:8px"></div>
    <div class="goal" style="margin-top:8px" id="ask"></div>
    <div class="nums" id="nums"></div>
    <div class="msg" id="tmsg"></div>
    <div class="row">
      <button class="btn primary" id="next">Indiki mesele</button>
      <button class="btn ghost" id="again">Täzeden</button>
    </div>
    <div class="score" id="tsc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Matematika 1, II kitap · 66–72-nji sahypalar</div>
</div>

<script>
var T = [
  ["Birinji tekjede 7 kitap bar. Ikinji tekjede ondan 2 kitap köp. Jemi näçe kitap bar?",
   "kitap", 7, 2, "+"],
  ["Howluda 5 towuk bar. Jüýjeler ondan 3 sany köp. Jemi näçe guş bar?",
   "guş", 5, 3, "+"],
  ["Birinji sebetde 8 alma bar. Ikinji sebetde ondan 2 alma az. Jemi näçe alma bar?",
   "alma", 8, 2, "−"],
  ["Aman 4 surat çekdi. Merjen ondan 3 surat köp çekdi. Jemi näçe surat çekildi?",
   "surat", 4, 3, "+"]
];
var ti = 0, stage = 0, d = 0, ok = 0;
function second() { var t = T[ti]; return t[4] === "+" ? t[2] + t[3] : t[2] - t[3]; }
function total() { return T[ti][2] + second(); }
function show() {
  var t = T[ti];
  document.getElementById("task").textContent = t[0];
  var s2 = stage >= 1 ? second() : "?";
  var tot = stage >= 2 ? total() : "?";
  document.getElementById("short").innerHTML =
    "<b>I</b> — " + t[2] + " " + t[1] + "<br><b>II</b> — " + s2 + " " + t[1] +
    " (ondan " + t[3] + " " + (t[4] === "+" ? "köp" : "az") + ")<br><b>Jemi</b> — " + tot + " " + t[1];
  document.getElementById("ask").textContent = stage === 0 ?
    ("1-nji amal: II hatarda näçe " + t[1] + " bar?") :
    (stage === 1 ? ("2-nji amal: jemi näçe " + t[1] + " bar?") : "Mesele çözüldi.");
  document.getElementById("tmsg").className = "msg";
  document.getElementById("tmsg").textContent = stage === 2 ?
    ("Jogap: " + total() + " " + t[1] + ".") : "";
  if (stage === 2) document.getElementById("tmsg").className = "msg ok";
}
var h = "";
for (var i = 2; i <= 21; i++) h += '<button class="btn" data-n="' + i + '">' + i + "</button>";
document.getElementById("nums").innerHTML = h;
var nb = document.getElementById("nums").getElementsByTagName("button");
for (var i = 0; i < nb.length; i++) {
  nb[i].onclick = function () {
    if (stage >= 2) return;
    var v = parseInt(this.getAttribute("data-n"), 10), m = document.getElementById("tmsg");
    var want = stage === 0 ? second() : total();
    d++;
    if (v === want) {
      ok++; stage++;
      show();
      if (stage === 1) { m.className = "msg ok"; m.textContent = "Dogry! Indi ikinji amaly ýerine ýetir."; }
    } else {
      m.className = "msg bad";
      m.textContent = "Ýalňyş. Ýene bir gezek gysga ýazga seret.";
    }
    document.getElementById("tsc").textContent = "Netije: " + ok + " / " + d;
  };
}
document.getElementById("next").onclick = function () { ti = (ti + 1) % T.length; stage = 0; show(); };
document.getElementById("again").onclick = function () { stage = 0; show(); };
show();

var Q = [
  ["Iki amally meselede näçe gezek hasaplaýarys?", ["Iki", "Bir", "Üç"], 0],
  ["Gysga ýazgy meseläniň nämesini görkezýär?", ["Şertini", "Jogabyny", "Adyny"], 0],
  ["I — 5 kitap, II — ondan 3 kitap köp. II näçe kitap?", ["8", "2", "5"], 0]
];
var qd = 0, qok = 0, hh = "";
for (var i = 0; i < Q.length; i++) {
  hh += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
  for (var j = 0; j < Q[i][1].length; j++) hh += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
  hh += '</div><div class="msg" id="qm' + i + '"></div></div>';
}
document.getElementById("quiz").innerHTML = hh;
var qb = document.getElementById("quiz").getElementsByTagName("button");
for (var i = 0; i < qb.length; i++) {
  qb[i].onclick = function () {
    var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
    var m = document.getElementById("qm" + k);
    if (m.getAttribute("data-done")) return;
    m.setAttribute("data-done", "1"); qd++;
    if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
    document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
  };
}
</script>
</body>
</html>
