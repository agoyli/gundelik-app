<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Türkmen pilini saplamak — 7-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .board { background: #fdfaf2; border-radius: 13px; padding: 8px; }
  .board svg { display: block; width: 100%; height: auto; max-height: 170px; }
  .list { display: grid; gap: 7px; }
  .list button { min-height: 50px; font-size: 15px; font-weight: 700; text-align: left; padding: 8px 12px; }
  .done { background: #dff2e3; border-radius: 12px; padding: 10px 12px; font-size: 15.5px; line-height: 1.7; }
  .kinds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .kinds button { min-height: 48px; font-size: 14.5px; font-weight: 700; }
  .task { background: #fff6e0; border-radius: 13px; padding: 13px; font-size: 16.5px; line-height: 1.6; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Türkmen pilini saplamak</h1>
  <div class="sub">Durmuş zähmeti · 7-nji synp</div>

  <div class="card">
    <div class="def">Dogry saplananda sap pile <b>göni barman, gyşyk</b> baryp, gowkurak
      görnüşde bolýar. Sap üçin taslama <b>150 sm</b> uzynlykda alynýar.</div>
    <div class="board"><svg id="bd" viewBox="0 0 320 160"></svg></div>
  </div>

  <div class="card">
    <h3>Saplamagyň ädimlerini tertibe düz</h3>
    <div class="goal" id="goal"></div>
    <div class="list" id="list"></div>
    <div class="msg" id="msg"></div>
    <div class="done" id="donebox" style="display:none"></div>
    <div class="row"><button class="btn ghost" id="reset">Täzeden başla</button></div>
    <div class="score" id="sc"></div>
  </div>

  <div class="card">
    <h3>Piliň bölegini tap</h3>
    <div class="task" id="task"></div>
    <div class="kinds" id="kinds">
      <button class="btn" data-k="gumhana">gumhana</button>
      <button class="btn" data-k="gulak">gulak</button>
      <button class="btn" data-k="hopba">hopba</button>
      <button class="btn" data-k="ernek">erňek</button>
      <button class="btn" data-k="sap">sap</button>
      <button class="btn" data-k="wint">wint</button>
    </div>
    <div class="msg" id="pmsg"></div>
    <div class="row"><button class="btn primary" id="pnext">Indiki</button></div>
    <div class="score" id="psc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Durmuş zähmeti 7 · 76–79-njy sahypalar</div>
</div>

<script>
document.getElementById("bd").innerHTML =
  '<rect x="0" y="0" width="320" height="160" fill="#fdfaf2"/>' +
  '<path d="M 60 120 L 120 108 L 150 96 L 140 78 L 105 84 L 55 104 Z" fill="#b9c4cc" stroke="#4a5560" stroke-width="2"/>' +
  '<path d="M 148 92 L 176 84 L 180 74 L 152 80 Z" fill="#8d99a4" stroke="#4a5560" stroke-width="2"/>' +
  '<line x1="176" y1="80" x2="292" y2="36" stroke="#a9773a" stroke-width="9" stroke-linecap="round"/>' +
  '<circle cx="180" cy="78" r="3.5" fill="#3b2c10"/>' +
  '<text x="52" y="138" font-size="11" fill="#3b2c10">gumhana</text>' +
  '<text x="150" y="112" font-size="11" fill="#3b2c10">hopba</text>' +
  '<text x="236" y="26" font-size="11" fill="#7a5c1e">sap (150 sm)</text>' +
  '<text x="188" y="96" font-size="11" fill="#3b2c10">M 6 wint</text>';

var S = [
  "Ýeňil, ýylmanak agajy (söwüt, tal, port agaç) saýlamaly",
  "Kesilen şahany oduň howruna tutup kakatmaly",
  "Sap üçin taslamany 150 sm uzynlykda almaly",
  "Hopbanyň öňünden piliň erňegine çenli A ölçegi almaly",
  "Bellikden ujuna tarap ýapgyt görnüşde çapmaly",
  "Ujuny hopba gabatlap ýonmaly we hopba salmaly",
  "6 mm buraw bilen deşip, M 6 wint bilen berkitmeli"
];
var next = 0, tries = 0, order = [4, 0, 6, 2, 5, 1, 3];
function render() {
  var h = "";
  for (var k = 0; k < order.length; k++) {
    var i = order[k];
    if (i < next) continue;
    h += '<button class="btn" data-i="' + i + '">' + S[i] + "</button>";
  }
  document.getElementById("list").innerHTML = h;
  var lb = document.getElementById("list").getElementsByTagName("button");
  for (var k = 0; k < lb.length; k++) lb[k].onclick = pick;
  document.getElementById("goal").textContent = next < S.length ?
    ((next + 1) + "-nji ädimi saýla.") : "Ähli 7 ädim dogry tertipde ýygnaldy!";
  var dv = document.getElementById("donebox");
  if (next > 0) {
    var dh = "";
    for (var i = 0; i < next; i++) dh += (i + 1) + ". " + S[i] + "<br>";
    dv.innerHTML = dh;
    dv.style.display = "block";
  } else {
    dv.style.display = "none";
    dv.innerHTML = "";
  }
  document.getElementById("sc").textContent = "Ädim: " + next + " / 7 · synanyşyk: " + tries;
}
function pick() {
  var i = parseInt(this.getAttribute("data-i"), 10), m = document.getElementById("msg");
  tries++;
  if (i === next) {
    next++;
    m.className = "msg ok";
    m.textContent = next === S.length ? "Tertip dogry!" : "Dogry!";
  } else {
    m.className = "msg bad";
    m.textContent = "Ilki " + (next + 1) + "-nji ädim gelmeli.";
  }
  render();
}
document.getElementById("reset").onclick = function () {
  next = 0; tries = 0;
  document.getElementById("msg").className = "msg";
  document.getElementById("msg").textContent = "";
  render();
};
render();

// [beýan, dogry açar, düşündiriş]
var P = [
  ["Erňeklerinden çöket bolýan bölek.", "gumhana", "Türkmen piliniň esasy bölegi."],
  ["Sapyň salynýan bölegi; öň tarapy daraldylýar.", "hopba",
   "Bu sapyň öňe süýşmezligini üpjün edýär."],
  ["Güberçeklendirilip galdyrylýan bölek.", "ernek", "Piliň güýje çydamlylygyny artdyrýar."],
  ["150 sm uzynlykda taýýarlanýan bölek.", "sap", "Söwüt, tal ýa-da port agaçdan."],
  ["Sapy pile berkidýän serişde.", "wint", "M 6 ölçegli, şaýba we gaýka bilen."],
  ["Aýak basylýan çykyt bölegi.", "gulak", "Piliň gulagy diýlip atlandyrylýar."],
  ["Bu bölegiň öň tarapy daraldylyp ýasalýar.", "hopba", "Sapyň süýşmezligi üçin."],
  ["Ele oňaýly bolar ýaly törpi bilen işlenilýän ýer.", "sap", "Sapyň ýokarky ujy."]
];
var pi = 0, pd = 0, pok = 0, plock = 0;
function showP() {
  document.getElementById("task").textContent = P[pi][0];
  document.getElementById("pmsg").className = "msg";
  document.getElementById("pmsg").textContent = "";
  plock = 0;
}
var kb = document.getElementById("kinds").getElementsByTagName("button");
for (var i = 0; i < kb.length; i++) {
  kb[i].onclick = function () {
    if (plock) return;
    plock = 1; pd++;
    var k = this.getAttribute("data-k"), m = document.getElementById("pmsg");
    if (k === P[pi][1]) { pok++; m.className = "msg ok"; m.textContent = "Dogry! " + P[pi][2]; }
    else { m.className = "msg bad"; m.textContent = "Ýalňyş. " + P[pi][2]; }
    document.getElementById("psc").textContent = "Netije: " + pok + " / " + pd;
  };
}
document.getElementById("pnext").onclick = function () { pi = (pi + 1) % P.length; showP(); };
showP();

var Q = [
  ["Sap üçin taslama näçe uzynlykda alynýar?", ["150 sm", "100 sm", "200 sm"], 0],
  ["Sap üçin haýsy agaç alynýar?", ["Söwüt, tal, port agaç", "Dub we sosna", "Diňe çynar"], 0],
  ["Sapy berkitmek üçin haýsy wint ulanylýar?", ["M 6", "M 12", "M 24"], 0]
];
var qd = 0, qok = 0, hq = "";
for (var i = 0; i < Q.length; i++) {
  hq += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
  for (var j = 0; j < Q[i][1].length; j++) hq += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
  hq += '</div><div class="msg" id="qm' + i + '"></div></div>';
}
document.getElementById("quiz").innerHTML = hq;
var qb = document.getElementById("quiz").getElementsByTagName("button");
for (var i = 0; i < qb.length; i++) {
  qb[i].onclick = function () {
    var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
    var m = document.getElementById("qm" + k);
    if (m.getAttribute("data-done")) return;
    m.setAttribute("data-done", "1"); qd++;
    if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
    document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
  };
}
</script>
</body>
</html>
