<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iki tapawut boýunça mesele — 4-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .task { background: #fff6e0; border-radius: 13px; padding: 13px; font-size: 17px; line-height: 1.6; }
  .chain { background: #f7fafd; border-radius: 12px; padding: 11px; font-size: 16.5px; line-height: 1.9; }
  .bars { background: #f7fafd; border-radius: 13px; padding: 10px; }
  .bars svg { display: block; width: 100%; height: auto; max-height: 130px; }
  .nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .nums button { min-height: 46px; font-size: 16px; font-weight: 700; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Iki tapawut boýunça näbelli sany tapmaga degişli mesele</h1>
  <div class="sub">Matematika · 4-nji synp</div>

  <div class="card">
    <div class="def">Ilki <b>mukdarlaryň tapawudyny</b>, soňra <b>bir birlige düşýän bahany</b>
      tapýarys, iň soňunda her mukdaryň bahasyny hasaplaýarys.</div>
  </div>

  <div class="card">
    <h3>Üç ädimde çöz</h3>
    <div class="bars"><svg id="bars" viewBox="0 0 320 120"></svg></div>
    <div class="task" id="task" style="margin-top:8px"></div>
    <div class="chain" id="chain" style="margin-top:8px"></div>
    <div class="goal" id="ask"></div>
    <div class="nums" id="nums"></div>
    <div class="msg" id="msg"></div>
    <div class="row">
      <button class="btn primary" id="next">Indiki mesele</button>
      <button class="btn ghost" id="again">Täzeden</button>
    </div>
    <div class="score" id="sc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Matematika 4, II kitap · 78–80-nji sahypalar</div>
</div>

<script>
// [uly mukdar, kiçi mukdar, baha tapawudy, mukdar birligi, baha birligi, tekst]
var T = [
  [8, 5, 60, "m", "manat", "Birinji bölekde 8 m mata, ikinjisinde 5 m mata bar. Birinji bölek ikinjisinden 60 manat gymmat. Her bölek näçe manat?"],
  [9, 4, 100, "kg", "manat", "Bir haltada 9 kg un, beýlekisinde 4 kg un bar. Birinji halta ikinjisinden 100 manat gymmat. Her halta näçe manat?"],
  [7, 3, 80, "sany", "manat", "Bir gutuda 7 sany depder, beýlekisinde 3 sany depder bar. Birinji guty ikinjisinden 80 manat gymmat. Her guty näçe manat?"],
  [10, 6, 48, "l", "manat", "Bir gapda 10 l ýag, beýlekisinde 6 l ýag bar. Birinji gap ikinjisinden 48 manat gymmat. Her gap näçe manat?"]
];
var ti = 0, stage = 0, d = 0, ok = 0;
function dm() { return T[ti][0] - T[ti][1]; }
function bir() { return T[ti][2] / dm(); }
function uly() { return T[ti][0] * bir(); }
function kici() { return T[ti][1] * bir(); }
function draw() {
  var t = T[ti], u = 260 / t[0];
  var s = '<rect x="20" y="18" width="' + (t[0] * u) + '" height="30" rx="7" fill="#c9dcf5" stroke="#2456b0" stroke-width="2"/>';
  s += '<text x="26" y="39" font-size="14" fill="#1e2a3a">' + t[0] + " " + t[3] + "</text>";
  s += '<rect x="20" y="62" width="' + (t[1] * u) + '" height="30" rx="7" fill="#d9ecdf" stroke="#2b7a4a" stroke-width="2"/>';
  s += '<text x="26" y="83" font-size="14" fill="#1e2a3a">' + t[1] + " " + t[3] + "</text>";
  var x1 = 20 + t[1] * u, x2 = 20 + t[0] * u;
  s += '<line x1="' + x1 + '" y1="14" x2="' + x1 + '" y2="106" stroke="#b0407a" stroke-width="2" stroke-dasharray="5 4"/>';
  s += '<text x="' + Math.min(x1 + 4, 240) + '" y="114" font-size="13" fill="#b0407a">tapawut: ' + t[2] + " " + t[4] + "</text>";
  document.getElementById("bars").innerHTML = s;
}
function show() {
  var t = T[ti];
  draw();
  document.getElementById("task").textContent = t[5];
  var l = "";
  if (stage >= 1) l += "1) " + t[0] + " − " + t[1] + " = " + dm() + " " + t[3] + "<br>";
  if (stage >= 2) l += "2) " + t[2] + " : " + dm() + " = " + bir() + " " + t[4] + " (1 " + t[3] + ")<br>";
  if (stage >= 3) l += "3) " + t[0] + " · " + bir() + " = " + uly() + " " + t[4] + ", " +
    t[1] + " · " + bir() + " = " + kici() + " " + t[4];
  document.getElementById("chain").innerHTML = l;
  document.getElementById("ask").textContent =
    stage === 0 ? "1-nji ädim: mukdarlaryň tapawudy näçe?" :
    stage === 1 ? ("2-nji ädim: 1 " + t[3] + " näçe " + t[4] + "?") :
    stage === 2 ? ("3-nji ädim: uly bölegiň bahasy näçe " + t[4] + "?") : "Mesele çözüldi.";
  var m = document.getElementById("msg");
  m.className = stage === 3 ? "msg ok" : "msg";
  m.textContent = stage === 3 ? ("Jogap: " + uly() + " " + t[4] + " we " + kici() + " " + t[4] + ".") : "";
}
function want() { return stage === 0 ? dm() : (stage === 1 ? bir() : uly()); }
var VALS = [3, 4, 5, 12, 16, 20, 32, 60, 80, 96, 120, 140, 160, 180, 200, 240];
var h = "";
for (var i = 0; i < VALS.length; i++) h += '<button class="btn" data-n="' + VALS[i] + '">' + VALS[i] + "</button>";
document.getElementById("nums").innerHTML = h;
var nb = document.getElementById("nums").getElementsByTagName("button");
for (var i = 0; i < nb.length; i++) {
  nb[i].onclick = function () {
    if (stage >= 3) return;
    var v = parseInt(this.getAttribute("data-n"), 10), m = document.getElementById("msg");
    d++;
    if (v === want()) {
      ok++; stage++; show();
      if (stage === 1) { m.className = "msg ok"; m.textContent = "Dogry! Şu tapawuda baha tapawudy düşýär."; }
      else if (stage === 2) { m.className = "msg ok"; m.textContent = "Dogry! Indi bir birligiň bahasyny mukdara köpelt."; }
    } else {
      m.className = "msg bad";
      m.textContent = stage === 0 ? "Ýalňyş. Uly mukdardan kiçi mukdary aýyr." :
        (stage === 1 ? "Ýalňyş. Baha tapawudyny mukdar tapawudyna böl." : "Ýalňyş. Uly mukdary bir birligiň bahasyna köpelt.");
    }
    document.getElementById("sc").textContent = "Netije: " + ok + " / " + d;
  };
}
document.getElementById("next").onclick = function () { ti = (ti + 1) % T.length; stage = 0; show(); };
document.getElementById("again").onclick = function () { stage = 0; show(); };
show();

var Q = [
  ["Iki tapawut boýunça meselede ilki näme tapylýar?",
   ["Mukdarlaryň tapawudy", "Umumy baha", "Uly bölegiň bahasy"], 0],
  ["8 m we 5 m mata, tapawut 60 manat bolsa, 1 m näçe manat?", ["20", "12", "15"], 0],
  ["Bir birligiň bahasy 20 manat bolsa, 8 m matanyň bahasy näçe?", ["160", "100", "140"], 0]
];
var qd = 0, qok = 0, hh = "";
for (var i = 0; i < Q.length; i++) {
  hh += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
  for (var j = 0; j < Q[i][1].length; j++) hh += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
  hh += '</div><div class="msg" id="qm' + i + '"></div></div>';
}
document.getElementById("quiz").innerHTML = hh;
var qb = document.getElementById("quiz").getElementsByTagName("button");
for (var i = 0; i < qb.length; i++) {
  qb[i].onclick = function () {
    var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
    var m = document.getElementById("qm" + k);
    if (m.getAttribute("data-done")) return;
    m.setAttribute("data-done", "1"); qd++;
    if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
    document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
  };
}
</script>
</body>
</html>
