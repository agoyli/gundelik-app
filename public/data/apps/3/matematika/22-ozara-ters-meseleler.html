<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Özara ters meseleler — 3-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .task { background: #fff6e0; border-radius: 13px; padding: 12px 13px; font-size: 16.5px; line-height: 1.65; }
  .three { background: #f7fafd; border-radius: 12px; padding: 11px; font-size: 16px; line-height: 1.9; }
  .nums { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .nums button { min-height: 46px; font-size: 16px; font-weight: 700; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Özara ters meseleler</h1>
  <div class="sub">Matematika · 3-nji synp</div>

  <div class="def" style="margin-bottom:12px">Bir meseläniň jogabyny şerte geçirip düzülen
    meselelere <b>özara ters meseleler</b> diýilýär. Olarda belli bilen näbelli
    orunlaryny çalyşýar.</div>

  <div class="card">
    <h3>Üç meseläni yzly-yzyna çöz</h3>
    <div class="task" id="task"></div>
    <div class="goal" id="ask" style="margin-top:8px"></div>
    <div class="nums" id="nums"></div>
    <div class="msg" id="tmsg"></div>
    <div class="three" id="three" style="margin-top:8px"></div>
    <div class="row">
      <button class="btn primary" id="next">Indiki topar</button>
      <button class="btn ghost" id="again">Täzeden</button>
    </div>
    <div class="score" id="tsc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Matematika 3, II kitap · 106–107-nji sahypalar</div>
</div>

<script>
// [at1, at2, zat, a, b]
var G = [
  ["Şemşat", "Jeren", "marka", 16, 11],
  ["Aman", "Merjen", "surat", 14, 12],
  ["Batyr", "Selbi", "kitap", 18, 15],
  ["Maral", "Aýjemal", "gül", 25, 13]
];
var gi = 0, stage = 0, d = 0, ok = 0;
function a() { return G[gi][3]; }
function b() { return G[gi][4]; }
function tot() { return a() + b(); }
function texts() {
  var g = G[gi];
  return [
    g[0] + " " + a() + " " + g[2] + ", " + g[1] + " bolsa " + b() + " " + g[2] +
      " toplady. Olar jemi näçe " + g[2] + " toplady?",
    g[0] + " bilen " + g[1] + " jemi " + tot() + " " + g[2] + " toplady. Şolaryň " + a() +
      "-syny " + g[0] + " toplan bolsa, " + g[1] + " näçe " + g[2] + " toplady?",
    g[0] + " bilen " + g[1] + " jemi " + tot() + " " + g[2] + " toplady. Şolaryň " + b() +
      "-sini " + g[1] + " toplan bolsa, " + g[0] + " näçe " + g[2] + " toplady?"
  ];
}
function want() { return stage === 0 ? tot() : (stage === 1 ? b() : a()); }
function draw() {
  var t = texts();
  document.getElementById("task").textContent = stage < 3 ? t[stage] : "Üç mesele hem çözüldi.";
  document.getElementById("ask").textContent = stage < 3 ?
    ((stage + 1) + "-nji meseläniň jogabyny saýla.") : "Bu meseleler özara ters meselelerdir.";
  var lines = ["1) " + a() + " + " + b() + " = " + (stage >= 1 ? tot() : "?"),
               "2) " + tot() + " − " + a() + " = " + (stage >= 2 ? b() : "?"),
               "3) " + tot() + " − " + b() + " = " + (stage >= 3 ? a() : "?")];
  document.getElementById("three").innerHTML = lines.join("<br>");
  var m = document.getElementById("tmsg");
  m.className = stage === 3 ? "msg ok" : "msg";
  m.textContent = stage === 3 ? "Bir meseläniň jogaby beýlekisiniň şertine geçdi." : "";
}
var h = "";
for (var i = 10; i <= 41; i++) h += '<button class="btn" data-n="' + i + '">' + i + "</button>";
document.getElementById("nums").innerHTML = h;
var nb = document.getElementById("nums").getElementsByTagName("button");
for (var i = 0; i < nb.length; i++) {
  nb[i].onclick = function () {
    if (stage >= 3) return;
    var v = parseInt(this.getAttribute("data-n"), 10), m = document.getElementById("tmsg");
    var w = want();
    d++;
    if (v === w) {
      ok++; stage++; draw();
      if (stage < 3) { m.className = "msg ok"; m.textContent = "Dogry! Indi ters meseläni çöz."; }
    } else {
      m.className = "msg bad";
      m.textContent = "Ýalňyş. Ýazgylara seret-de, gerekli amaly saýla.";
    }
    document.getElementById("tsc").textContent = "Netije: " + ok + " / " + d;
  };
}
document.getElementById("next").onclick = function () { gi = (gi + 1) % G.length; stage = 0; draw(); };
document.getElementById("again").onclick = function () { stage = 0; draw(); };
draw();

var Q = [
  ["Bir meseläniň jogabyny şerte geçirip düzülen meselelere näme diýilýär?",
   ["Özara ters meseleler", "Iki amally meseleler", "Deňlemeler"], 0],
  ["16 + 11 = 27 meselesine ters mesele haýsy amaly talap edýär?", ["Aýyrmak", "Goşmak", "Köpeltmek"], 0],
  ["27 markanyň 16-sy bir gyzyňky bolsa, beýlekisiniňki näçe?", ["11", "16", "43"], 0]
];
var qd = 0, qok = 0, hh = "";
for (var i = 0; i < Q.length; i++) {
  hh += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
  for (var j = 0; j < Q[i][1].length; j++) hh += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
  hh += '</div><div class="msg" id="qm' + i + '"></div></div>';
}
document.getElementById("quiz").innerHTML = hh;
var qb = document.getElementById("quiz").getElementsByTagName("button");
for (var i = 0; i < qb.length; i++) {
  qb[i].onclick = function () {
    var k = parseInt(this.getAttribute("data-q"), 10), a2 = parseInt(this.getAttribute("data-a"), 10);
    var m = document.getElementById("qm" + k);
    if (m.getAttribute("data-done")) return;
    m.setAttribute("data-done", "1"); qd++;
    if (a2 === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
    document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
  };
}
</script>
</body>
</html>
