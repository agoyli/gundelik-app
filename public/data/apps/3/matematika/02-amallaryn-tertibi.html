<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ýaýly aňlatmalarda amallaryň tertibi — 3-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .eq { background: #fff6e0; border-radius: 13px; padding: 14px; text-align: center; font-size: 24px; font-weight: 800; }
  .chain { background: #f7fafd; border-radius: 12px; padding: 11px; font-size: 17px; line-height: 1.9; text-align: center; }
  .parts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .parts button { min-height: 52px; font-size: 16px; font-weight: 700; }
  .nums { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .nums button { min-height: 46px; font-size: 16px; font-weight: 700; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ýaýly aňlatmalarda amallaryň tertibi</h1>
  <div class="sub">Matematika · 3-nji synp</div>

  <div class="card">
    <div class="def"><b>1)</b> Ýaý içindäki amal ilki. <b>2)</b> Soňra köpeltmek we bölmek.
      <b>3)</b> Iň soňunda goşmak we aýyrmak – çepden saga.</div>
  </div>

  <div class="card">
    <h3>1-nji ädim: haýsy amal ilki?</h3>
    <div class="eq" id="eq"></div>
    <div class="parts" id="parts" style="margin-top:8px"></div>
    <div class="msg" id="pmsg"></div>
  </div>

  <div class="card">
    <h3>2-nji ädim: netijäni tap</h3>
    <div class="chain" id="chain"></div>
    <div class="nums" id="nums" style="margin-top:8px"></div>
    <div class="msg" id="tmsg"></div>
    <div class="row">
      <button class="btn primary" id="next">Indiki aňlatma</button>
      <button class="btn ghost" id="again">Täzeden</button>
    </div>
    <div class="score" id="tsc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Matematika 3, I kitap · 58–61-nji sahypalar</div>
</div>

<script>
// [aňlatma, ilkinji amal, ýalňyş görnüşler, netije, düşündiriş]
var T = [
  ["(34 − 26) · 7", "34 − 26", ["34 · 7", "26 · 7"], 56, "Ýaý içindäki amal ilki ýerine ýetirilýär."],
  ["2 · 7 − 24 : 3", "2 · 7", ["7 − 24", "24 : 3 − 2"], 6, "Ýaý ýok: ilki köpeltmek we bölmek, soňra aýyrmak."],
  ["3 · 9 + 8 · 8", "3 · 9", ["9 + 8", "8 + 8"], 91, "Ilki iki köpeltmek, soňra goşmak."],
  ["4 · (100 − 93)", "100 − 93", ["4 · 100", "4 · 93"], 28, "Ýaý içindäki aýyrmak ilki edilýär."],
  ["72 : 9 + 56 : 8", "72 : 9", ["9 + 56", "72 : 56"], 15, "Ilki iki bölmek, soňra goşmak."],
  ["(49 − 26) + 18", "49 − 26", ["26 + 18", "49 + 18"], 41, "Ýaý içindäki amal birinji."]
];
var ti = 0, stage = 0, d = 0, ok = 0;
function show() {
  var t = T[ti];
  document.getElementById("eq").textContent = t[0] + " = ?";
  var arr = [t[1], t[2][0], t[2][1]];
  if (ti % 3 === 1) arr = [t[2][0], t[1], t[2][1]];
  if (ti % 3 === 2) arr = [t[2][1], t[2][0], t[1]];
  var h = "";
  for (var k = 0; k < 3; k++) h += '<button class="btn" data-p="' + arr[k] + '">' + arr[k] + "</button>";
  document.getElementById("parts").innerHTML = h;
  var bs = document.getElementById("parts").getElementsByTagName("button");
  for (var j = 0; j < bs.length; j++) bs[j].onclick = pclick;
  document.getElementById("pmsg").className = "msg";
  document.getElementById("pmsg").textContent = "";
  document.getElementById("chain").textContent = "Ilki ýokardan dogry amaly saýla.";
  document.getElementById("tmsg").className = "msg";
  document.getElementById("tmsg").textContent = "";
}
function pclick() {
  if (stage >= 1) return;
  var t = T[ti], v = this.getAttribute("data-p"), m = document.getElementById("pmsg");
  if (v === t[1]) {
    stage = 1; m.className = "msg ok"; m.textContent = "Dogry! " + t[4];
    document.getElementById("chain").textContent = t[0] + " → ilki " + t[1] + " … indi doly netijäni tap.";
  } else {
    m.className = "msg bad"; m.textContent = "Ýalňyş. " + t[4];
  }
}
var PAD = [];
for (var i = 4; i <= 30; i++) PAD.push(i);
PAD.push(41); PAD.push(56); PAD.push(91);
var h = "";
for (var i = 0; i < PAD.length; i++) h += '<button class="btn" data-n="' + PAD[i] + '">' + PAD[i] + "</button>";
document.getElementById("nums").innerHTML = h;
var nb = document.getElementById("nums").getElementsByTagName("button");
for (var i = 0; i < nb.length; i++) {
  nb[i].onclick = function () {
    var m = document.getElementById("tmsg");
    if (stage !== 1) {
      m.className = "msg bad";
      m.textContent = stage === 0 ? "Ilki birinji amaly saýla." : "Bu aňlatma çözüldi.";
      return;
    }
    var v = parseInt(this.getAttribute("data-n"), 10), t = T[ti];
    stage = 2; d++;
    if (v === t[3]) { ok++; m.className = "msg ok"; m.textContent = "Dogry! " + t[0] + " = " + t[3] + "."; }
    else { m.className = "msg bad"; m.textContent = "Ýalňyş. " + t[0] + " = " + t[3] + "."; }
    document.getElementById("chain").textContent = t[0] + " = " + t[3];
    document.getElementById("tsc").textContent = "Netije: " + ok + " / " + d;
  };
}
document.getElementById("next").onclick = function () { ti = (ti + 1) % T.length; stage = 0; show(); };
document.getElementById("again").onclick = function () { stage = 0; show(); };
show();

var Q = [
  ["Aňlatmada haýsy amal ilki ýerine ýetirilýär?", ["Ýaý içindäki", "Iň çepdäki", "Iň sagdaky"], 0],
  ["(34 − 26) · 7 näçe bolar?", ["56", "182", "8"], 0],
  ["Ýaý bolmasa, ilki haýsy amallar edilýär?", ["Köpeltmek we bölmek", "Goşmak we aýyrmak", "Tapawudy ýok"], 0]
];
var qd = 0, qok = 0, hh = "";
for (var i = 0; i < Q.length; i++) {
  hh += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
  for (var j = 0; j < Q[i][1].length; j++) hh += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
  hh += '</div><div class="msg" id="qm' + i + '"></div></div>';
}
document.getElementById("quiz").innerHTML = hh;
var qb = document.getElementById("quiz").getElementsByTagName("button");
for (var i = 0; i < qb.length; i++) {
  qb[i].onclick = function () {
    var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
    var m = document.getElementById("qm" + k);
    if (m.getAttribute("data-done")) return;
    m.setAttribute("data-done", "1"); qd++;
    if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
    document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
  };
}
</script>
</body>
</html>
