<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ereme grafigi — 8-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .stage { background: #f6faf4; border-radius: 13px; padding: 6px; }
  .stage svg { display: block; width: 100%; height: auto; }
  .info { background: #fdfaf2; border-radius: 12px; padding: 11px 13px; font-size: 16px; line-height: 1.7; min-height: 62px; }
  .pool { display: grid; gap: 7px; }
  .pool button { min-height: 48px; font-size: 15px; font-weight: 700; text-align: left; padding: 8px 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { min-height: 44px; font-size: 15px; font-weight: 700; padding: 6px 12px; }
  .lines { display: grid; gap: 6px; }
  .lines button { min-height: 46px; font-size: 15.5px; font-weight: 600; text-align: left; padding: 8px 12px; }
  .r0 { background: #dbeafe !important; }
  .r1 { background: #dcfce7 !important; }
  .r2 { background: #fee2e2 !important; }
  .done { background: #dff2e3; border-radius: 12px; padding: 10px 12px; font-size: 15.5px; line-height: 1.7; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
  .flow { stroke-dasharray: 7 6; }
  .flow-up { animation: mv 1.5s linear infinite; }
  .flow-dn { animation: mv 1.5s linear infinite reverse; }
  @keyframes mv { to { stroke-dashoffset: -26; } }
  .tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
  .tbl th, .tbl td { border: 1px solid #cfe0bd; padding: 9px 7px; text-align: left; line-height: 1.45; }
  .tbl th { background: #eaf3e4; font-weight: 700; }
  .tbl td { cursor: pointer; }
  .tbl td.sel { background: #cdebd6; }
  .tbl-wrap { overflow-x: auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Kristal jisimiň ereme grafigi</h1>
  <div class="sub">Fizika · 8-nji synp</div>

  <div class="card">
    <div class="def">Ereme wagtynda termometr durýar.</div>
  </div>

  <div class="card">
    <h3>Buzy gyzdyr we sowat</h3>
    <div class="goal">Wagty süýşürgiç bilen geçir.</div>
    <div class="stage"><svg id="sisvg1" viewBox="0 0 320 190"></svg></div>
    <div class="row"><span class="mono" id="silab1"></span></div>
    <input class="slider" id="siinp1" type="range" min="0" max="24" step="1" value="0">
    <div class="info" id="siro1"></div>
    <div class="note">Ereme we gatama temperaturasy deňdir: ter = tgat = 0 °C.</div>
  </div>

  <div class="card">
    <h3>Grafigiň kesimleri</h3>
    <div class="goal" id="ogoal"></div>
    <div class="pool" id="opool"></div>
    <div class="msg" id="omsg"></div>
    <div class="done" id="odone" style="display:none"></div>
    <div class="row"><button class="btn ghost" id="oreset">Täzeden başla</button></div>
    <div class="score" id="osc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Fizika 8 (G. Toýlyýew we başg.), Aşgabat 2020 — kitaba görä.</div>
</div>
<script>

(function () {
  var inp = document.getElementById("siinp1");
  var sv = document.getElementById("sisvg1");
  var ro = document.getElementById("siro1");
  var lb = document.getElementById("silab1");
  function render(v) { function tem(x) {
  if (x <= 4) return -20 + x * 5;
  if (x <= 8) return 0;
  if (x <= 12) return (x - 8) * 5;
  if (x <= 16) return 20 - (x - 12) * 5;
  if (x <= 20) return 0;
  return -(x - 20) * 5;
}
function px(x) { return 26 + x * 11; }
function py(t) { return 100 - t * 3; }
var s = '<rect x="0" y="0" width="320" height="190" fill="#f7fafd"/>';
s += '<line x1="26" y1="100" x2="300" y2="100" stroke="#93a2b5" stroke-width="2"/>';
s += '<line x1="26" y1="20" x2="26" y2="180" stroke="#5b6b80" stroke-width="2"/>';
s += '<text x="4" y="104" font-size="11" fill="#5b6b80">0</text>';
s += '<text x="292" y="116" font-size="11" fill="#5b6b80">t</text>';
var d = '';
for (var i = 0; i <= 24; i += 0.5) {
  d += (i ? ' L' : 'M') + (Math.round(px(i) * 10) / 10) + ' ' +
       (Math.round(py(tem(i)) * 10) / 10);
}
s += '<path d="' + d + '" fill="none" stroke="#c8d4e4" stroke-width="3"/>';
var d2 = '';
for (var j = 0; j <= v; j += 0.5) {
  d2 += (j ? ' L' : 'M') + (Math.round(px(j) * 10) / 10) + ' ' +
        (Math.round(py(tem(j)) * 10) / 10);
}
if (v > 0) s += '<path d="' + d2 + '" fill="none" stroke="#2456b0" stroke-width="4"/>';
s += '<circle cx="' + (Math.round(px(v) * 10) / 10) + '" cy="' +
     (Math.round(py(tem(v)) * 10) / 10) + '" r="6" fill="#b02424"/>';
return s; }
  function readout(v) { function tem(x) {
  if (x <= 4) return -20 + x * 5;
  if (x <= 8) return 0;
  if (x <= 12) return (x - 8) * 5;
  if (x <= 16) return 20 - (x - 12) * 5;
  if (x <= 20) return 0;
  return -(x - 20) * 5;
}
var t = tem(v), f;
if (v < 4) f = 'AB: buz gyzýar';
else if (v < 8) f = 'BÇ: buz ereýär, temperatura durýar';
else if (v < 12) f = 'ÇD: suw gyzýar';
else if (v < 16) f = 'DE: suw sowaýar';
else if (v < 20) f = 'EF: suw gataýar, temperatura durýar';
else f = 'FK: buz sowaýar';
return f + '. Temperatura ' + t + ' °C.'; }
  function upd() {
    var v = parseFloat(inp.value);
    sv.innerHTML = render(v);
    ro.innerHTML = String(readout(v)).replace(/(\d)\.(\d)/g, "$1,$2");
    lb.textContent = "Wagt" + ": " + String(v).replace(".", ",") + " " + "min";
  }
  inp.oninput = upd;
  upd();
})();

var OS = ["AB — buz gyzýar", "BÇ — buz ereýär", "ÇD — suw gyzýar", "DE — suw sowaýar", "EF — suw gataýar", "FK — buz sowaýar"], OO = [2, 5, 0, 4, 1, 3];
(function () {
  var next = 0, tries = 0, N = OS.length;
  function draw() {
    var h = "";
    for (var k = 0; k < OO.length; k++) {
      var i = OO[k];
      if (i < next) continue;
      h += '<button class="btn" data-i="' + i + '">' + OS[i] + "</button>";
    }
    document.getElementById("opool").innerHTML = h;
    var bs = document.getElementById("opool").getElementsByTagName("button");
    for (var k = 0; k < bs.length; k++) bs[k].onclick = pick;
    document.getElementById("ogoal").textContent = next < N ?
      ((next + 1) + "-nji ädimi saýla.") : ("Ähli " + N + " ädim dogry tertipde ýygnaldy!");
    var dv = document.getElementById("odone");
    if (next > 0) {
      var dh = "";
      for (var i = 0; i < next; i++) dh += (i + 1) + ". " + OS[i] + "<br>";
      dv.innerHTML = dh; dv.style.display = "block";
    } else { dv.style.display = "none"; dv.innerHTML = ""; }
    document.getElementById("osc").textContent = "Ädim: " + next + " / " + N + " · synanyşyk: " + tries;
  }
  function pick() {
    var i = parseInt(this.getAttribute("data-i"), 10), m = document.getElementById("omsg");
    tries++;
    if (i === next) {
      next++;
      m.className = "msg ok";
      m.textContent = next === N ? "Tertip dogry!" : "Dogry!";
    } else {
      m.className = "msg bad";
      m.textContent = "Ilki " + (next + 1) + "-nji ädim gelmeli.";
    }
    draw();
  }
  document.getElementById("oreset").onclick = function () {
    next = 0; tries = 0;
    document.getElementById("omsg").className = "msg";
    document.getElementById("omsg").textContent = "";
    draw();
  };
  draw();
})();

var Q = [["Ereme wagtynda temperatura nähili bolýar?", ["Artýar", "Üýtgemeýär", "Peselýär"], 1], ["Buzuň ereme temperaturasy näçe?", ["0 °C", "100 °C", "–20 °C"], 0], ["Eremegiň udel ýylylygy haýsy harp bilen belgilenýär?", ["L", "λ", "c"], 1]];
(function () {
  var qd = 0, qok = 0, h = "";
  for (var i = 0; i < Q.length; i++) {
    h += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
    for (var j = 0; j < Q[i][1].length; j++)
      h += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
    h += '</div><div class="msg" id="qm' + i + '"></div></div>';
  }
  document.getElementById("quiz").innerHTML = h;
  var bs = document.getElementById("quiz").getElementsByTagName("button");
  for (var i = 0; i < bs.length; i++) {
    bs[i].onclick = function () {
      var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
      var m = document.getElementById("qm" + k);
      if (m.getAttribute("data-done")) return;
      m.setAttribute("data-done", "1"); qd++;
      if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
      else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
      document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
    };
  }
})();
</script>
</body>
</html>
