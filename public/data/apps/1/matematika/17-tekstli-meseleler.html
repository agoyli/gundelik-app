<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tekstli meseleler. Sany artdyrmak — 1-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .task { background: #fff6e0; border-radius: 13px; padding: 12px 13px; font-size: 16.5px; line-height: 1.65; }
  .task .s { color: #7a5a12; font-weight: 700; }
  .parts { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .parts button { min-height: 50px; font-size: 15px; }
  .nums { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .nums button { min-height: 46px; font-size: 18px; font-weight: 700; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Tekstli meseleler. Sany artdyrmak</h1>
  <div class="sub">Matematika · 1-nji synp</div>

  <div class="card">
    <div class="def">Meselede <b>şert</b> we <b>sorag</b> bolýar. «Ondan näçe birlik
      <b>köp</b>» diýilse, <b>goşmak</b> amaly ulanylýar.</div>
  </div>

  <div class="card">
    <h3>Şerti we soragy tap</h3>
    <div class="task" id="ptask"></div>
    <div class="goal" style="margin-top:8px">Ýokarky sözlemleriň haýsysy sorag?</div>
    <div class="parts" id="parts"></div>
    <div class="msg" id="pmsg"></div>
    <div class="row"><button class="btn ghost" id="pnew">Başga mesele</button></div>
  </div>

  <div class="card">
    <h3>Meseläni çöz</h3>
    <div class="task" id="task"></div>
    <div class="goal" style="margin-top:8px">Jogaby saýla:</div>
    <div class="nums" id="nums"></div>
    <div class="msg" id="tmsg"></div>
    <div class="row"><button class="btn primary" id="next">Indiki mesele</button></div>
    <div class="score" id="tsc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Matematika 1, II kitap · 8–14-nji sahypalar</div>
</div>

<script>
var P = [
  ["Sebetde 5 alma bar.", "Tarelkada ondan 2 alma köp.", "Tarelkada näçe alma bar?"],
  ["Aman 4 surat çekdi.", "Merjen ondan 3 surat köp çekdi.", "Merjen näçe surat çekdi?"],
  ["Baglykda 6 düýp bag bar.", "Howluda ondan 1 düýp bag köp.", "Howluda näçe düýp bag bar?"]
];
var pi = 0;
function drawP() {
  var p = P[pi];
  document.getElementById("ptask").innerHTML =
    '<span class="s">Şert:</span> ' + p[0] + " " + p[1] + "<br>" + p[2];
  var h = "";
  for (var i = 0; i < 3; i++) h += '<button class="btn" data-i="' + i + '">' + p[i] + "</button>";
  document.getElementById("parts").innerHTML = h;
  var bs = document.getElementById("parts").getElementsByTagName("button");
  for (var k = 0; k < bs.length; k++) {
    bs[k].onclick = function () {
      var i = parseInt(this.getAttribute("data-i"), 10), m = document.getElementById("pmsg");
      if (i === 2) { m.className = "msg ok"; m.textContent = "Dogry! Bu – meseläniň soragy."; }
      else { m.className = "msg bad"; m.textContent = "Bu sözlem şerte degişli, sorag däl."; }
    };
  }
  document.getElementById("pmsg").className = "msg";
  document.getElementById("pmsg").textContent = "";
}
document.getElementById("pnew").onclick = function () { pi = (pi + 1) % P.length; drawP(); };
drawP();

var T = [
  ["Alynyň 6 galamy bar. Merjeniň ondan 2 galam köp. Merjeniň näçe galamy bar?", 6, 2],
  ["Tekjede 4 kitap bar. Aýnada ondan 3 kitap köp. Aýnada näçe kitap bar?", 4, 3],
  ["Howluda 5 towuk bar. Jüýjeler ondan 4 sany köp. Näçe jüýje bar?", 5, 4],
  ["Bagda 7 düýp bag bar. Köçede ondan 1 düýp köp. Köçede näçe düýp bag bar?", 7, 1]
];
var ti = 0, d = 0, ok = 0, lock = 0;
function showT() {
  document.getElementById("task").textContent = T[ti][0];
  document.getElementById("tmsg").className = "msg";
  document.getElementById("tmsg").textContent = "";
  lock = 0;
}
var h = "";
for (var i = 5; i <= 10; i++) h += '<button class="btn" data-n="' + i + '">' + i + "</button>";
document.getElementById("nums").innerHTML = h;
var nb = document.getElementById("nums").getElementsByTagName("button");
for (var i = 0; i < nb.length; i++) {
  nb[i].onclick = function () {
    if (lock) return;
    lock = 1; d++;
    var v = parseInt(this.getAttribute("data-n"), 10), t = T[ti], r = t[1] + t[2];
    var m = document.getElementById("tmsg");
    if (v === r) { ok++; m.className = "msg ok"; m.textContent = "Dogry! " + t[1] + " + " + t[2] + " = " + r + "."; }
    else { m.className = "msg bad"; m.textContent = "Ýalňyş. «Köp» diýilýär, şonuň üçin " + t[1] + " + " + t[2] + " = " + r + "."; }
    document.getElementById("tsc").textContent = "Netije: " + ok + " / " + d;
  };
}
document.getElementById("next").onclick = function () { ti = (ti + 1) % T.length; showT(); };
showT();

var Q = [
  ["Sany 4 birlik artdyrmak üçin näme etmeli?", ["4 goşmaly", "4 aýyrmaly", "Üýtgetmeli däl"], 0],
  ["Meselede näme tapmalydygyny haýsy bölek görkezýär?", ["Sorag", "Şert", "Jogap"], 0],
  ["Alynyň 6 galamy bar, Merjeniň ondan 2 galam köp. Merjeniň näçe galamy bar?", ["8", "4", "6"], 0]
];
var qd = 0, qok = 0, hh = "";
for (var i = 0; i < Q.length; i++) {
  hh += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
  for (var j = 0; j < Q[i][1].length; j++) hh += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
  hh += '</div><div class="msg" id="qm' + i + '"></div></div>';
}
document.getElementById("quiz").innerHTML = hh;
var qb = document.getElementById("quiz").getElementsByTagName("button");
for (var i = 0; i < qb.length; i++) {
  qb[i].onclick = function () {
    var k = parseInt(this.getAttribute("data-q"), 10), an = parseInt(this.getAttribute("data-a"), 10);
    var m = document.getElementById("qm" + k);
    if (m.getAttribute("data-done")) return;
    m.setAttribute("data-done", "1"); qd++;
    if (an === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
    document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
  };
}
</script>
</body>
</html>
