<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>“Köp” we “bir” düşünjeleri — 1-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .scene { background: #f7fafd; border-radius: 13px; padding: 12px; font-size: 30px; line-height: 1.5; min-height: 74px; }
  .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .pick button { min-height: 50px; font-size: 16px; }
  .cnt { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .cnt button { min-height: 46px; font-size: 18px; font-weight: 700; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>“Köp” we “bir”</h1>
  <div class="sub">Matematika · 1-nji synp</div>

  <div class="card">
    <div class="def">Zadyň diňe bir sanysy bolsa – <b>bir</b>, birden artyk bolsa –
      <b>köp</b> diýilýär. Köp zady <b>sanap</b>, takyk sanyny tapýarys.</div>
  </div>

  <div class="card">
    <h3>Bir ýa-da köp?</h3>
    <div class="scene" id="scene"></div>
    <div class="pick" style="margin-top:9px">
      <button class="btn" id="one">Bir</button>
      <button class="btn" id="many">Köp</button>
    </div>
    <div class="msg" id="pmsg"></div>
    <div class="row"><button class="btn primary" id="next">Indiki surat</button></div>
    <div class="score" id="psc"></div>
  </div>

  <div class="card">
    <h3>Näçe sany?</h3>
    <div class="scene" id="scene2"></div>
    <div class="goal" style="margin-top:8px">Sana-da, dogry sana bas.</div>
    <div class="cnt" id="cnt"></div>
    <div class="msg" id="cmsg"></div>
    <div class="row"><button class="btn ghost" id="cnew">Täze surat</button></div>
    <div class="score" id="csc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Matematika 1, I kitap · 33–34-nji sahypalar</div>
</div>

<script>
var S = [["☀️", 1], ["⭐⭐⭐⭐⭐⭐", 6], ["🌙", 1], ["🐥🐥🐥🐥", 4], ["🌳", 1], ["🍎🍎🍎", 3]];
var si = 0, d = 0, ok = 0, lock = 0;
function draw() {
  document.getElementById("scene").textContent = S[si][0];
  document.getElementById("pmsg").className = "msg";
  document.getElementById("pmsg").textContent = "";
  lock = 0;
}
function ans(isOne) {
  if (lock) return;
  lock = 1; d++;
  var n = S[si][1], right = (n === 1) === isOne, m = document.getElementById("pmsg");
  if (right) { ok++; m.className = "msg ok"; m.textContent = n === 1 ? "Dogry! Bir sany." : "Dogry! Köp – jemi " + n + " sany."; }
  else { m.className = "msg bad"; m.textContent = "Ýalňyş. Bu ýerde " + n + " sany zat bar."; }
  document.getElementById("psc").textContent = "Netije: " + ok + " / " + d;
}
document.getElementById("one").onclick = function () { ans(true); };
document.getElementById("many").onclick = function () { ans(false); };
document.getElementById("next").onclick = function () { si = (si + 1) % S.length; draw(); };
draw();

var C = [["🐝🐝🐝🐝🐝", 5], ["🌸🌸🌸", 3], ["🐟🐟🐟🐟🐟🐟🐟", 7], ["🚗🚗", 2], ["🍇🍇🍇🍇🍇🍇", 6]];
var ci = 0, cd = 0, cok = 0, clock = 0;
function drawC() {
  document.getElementById("scene2").textContent = C[ci][0];
  document.getElementById("cmsg").className = "msg";
  document.getElementById("cmsg").textContent = "";
  clock = 0;
}
var h = "";
for (var i = 1; i <= 10; i++) h += '<button class="btn" data-n="' + i + '">' + i + "</button>";
document.getElementById("cnt").innerHTML = h;
var cb = document.getElementById("cnt").getElementsByTagName("button");
for (var i = 0; i < cb.length; i++) {
  cb[i].onclick = function () {
    if (clock) return;
    clock = 1; cd++;
    var n = parseInt(this.getAttribute("data-n"), 10), m = document.getElementById("cmsg");
    if (n === C[ci][1]) { cok++; m.className = "msg ok"; m.textContent = "Dogry! Jemi " + n + " sany."; }
    else { m.className = "msg bad"; m.textContent = "Ýalňyş. Ýene sana: jemi " + C[ci][1] + " sany."; }
    document.getElementById("csc").textContent = "Netije: " + cok + " / " + cd;
  };
}
document.getElementById("cnew").onclick = function () { ci = (ci + 1) % C.length; drawC(); };
drawC();

var Q = [
  ["Asmanda näçe Aý bar?", ["Bir", "Köp", "Iki"], 0],
  ["«Bir» näme diýmek?", ["Zadyň diňe bir sanysy", "Zatlaryň köpdügi", "Zadyň ýoklugy"], 0],
  ["Köp zadyň takyk sanyny nädip bilmeli?", ["Sanamaly", "Çaklamaly", "Ölçemeli"], 0]
];
var qd = 0, qok = 0, hh = "";
for (var i = 0; i < Q.length; i++) {
  hh += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
  for (var j = 0; j < Q[i][1].length; j++) hh += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
  hh += '</div><div class="msg" id="qm' + i + '"></div></div>';
}
document.getElementById("quiz").innerHTML = hh;
var qb = document.getElementById("quiz").getElementsByTagName("button");
for (var i = 0; i < qb.length; i++) {
  qb[i].onclick = function () {
    var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
    var m = document.getElementById("qm" + k);
    if (m.getAttribute("data-done")) return;
    m.setAttribute("data-done", "1"); qd++;
    if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
    document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
  };
}
</script>
</body>
</html>
