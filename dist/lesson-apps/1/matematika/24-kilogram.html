<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kilogram — 1-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .scale { background: #f7fafd; border-radius: 13px; padding: 10px; }
  svg { display: block; width: 100%; height: auto; }
  .nums { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .nums button { min-height: 46px; font-size: 17px; font-weight: 700; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Kilogram</h1>
  <div class="sub">Matematika · 1-nji synp</div>

  <div class="card">
    <div class="def"><b>Kilogram</b> agram ölçemekde ulanylýar. Ol gysgaça <b>«kg»</b>
      görnüşinde ýazylýar. Agram <b>terezi</b> bilen ölçenilýär.</div>
  </div>

  <div class="card">
    <h3>Terezini deňleşdir</h3>
    <div class="goal">Sag tarapa daş goşup, terezini deňleşdir.</div>
    <div class="scale"><svg id="sv" viewBox="0 0 300 130"></svg></div>
    <div class="row">
      <button class="btn primary" id="add">+ 1 kg daş</button>
      <button class="btn" id="rem">− 1 kg daş</button>
      <button class="btn ghost" id="new">Täze haryt</button>
    </div>
    <div class="msg" id="smsg"></div>
    <div class="score" id="ssc"></div>
  </div>

  <div class="card">
    <h3>Agramy hasapla</h3>
    <div class="goal" id="task"></div>
    <div class="nums" id="nums"></div>
    <div class="msg" id="tmsg"></div>
    <div class="row"><button class="btn ghost" id="tnext">Başga mesele</button></div>
    <div class="score" id="tsc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Matematika 1, II kitap · 63–64-nji sahypalar</div>
</div>

<script>
var GOODS = [["Kartoşka", "🥔", 3], ["Kelem", "🥬", 2], ["Alma", "🍎", 4], ["Sogan", "🧅", 5]];
var gi = 0, w = 0, solved = 0, tries = 0;
function draw() {
  var g = GOODS[gi], diff = w - g[2];
  var tilt = diff === 0 ? 0 : (diff > 0 ? 12 : -12);
  var ly = 55 + tilt, ry = 55 - tilt;
  var s = '<line x1="150" y1="20" x2="150" y2="115" stroke="#7a8798" stroke-width="4"/>';
  s += '<line x1="45" y1="' + ly + '" x2="255" y2="' + ry + '" stroke="#4a5a6a" stroke-width="5" stroke-linecap="round"/>';
  s += '<rect x="15" y="' + (ly + 8) + '" width="70" height="26" rx="6" fill="#dbe6f5"/>';
  s += '<rect x="215" y="' + (ry + 8) + '" width="70" height="26" rx="6" fill="#f5e6db"/>';
  s += '<text x="50" y="' + (ly + 26) + '" font-size="15" text-anchor="middle">' + g[1] + "</text>";
  s += '<text x="250" y="' + (ry + 26) + '" font-size="13" text-anchor="middle" fill="#5a4a2a">' + w + " kg</text>";
  s += '<text x="150" y="128" font-size="11" text-anchor="middle" fill="#4a5a6a">' +
    (diff === 0 ? "Terezi deň" : (diff > 0 ? "Sag tarap agyr" : "Çep tarap agyr")) + "</text>";
  document.getElementById("sv").innerHTML = s;
  var m = document.getElementById("smsg");
  if (diff === 0 && w > 0) {
    m.className = "msg ok";
    m.textContent = g[0] + " " + g[2] + " kg agyrlykda. Terezi deňleşdi.";
  } else {
    m.className = "msg";
    m.textContent = diff > 0 ? "Daşlar agyr geldi – birini aýyr." : "Haryt agyr – ýene daş goş.";
  }
}
document.getElementById("add").onclick = function () {
  if (w < 8) w++;
  tries++;
  draw();
  if (w === GOODS[gi][2]) { solved++; document.getElementById("ssc").textContent = "Deňleşdirilen: " + solved; }
};
document.getElementById("rem").onclick = function () { if (w > 0) w--; draw(); };
document.getElementById("new").onclick = function () { gi = (gi + 1) % GOODS.length; w = 0; draw(); };
draw();

var T = [[3, 2, "+"], [5, 2, "−"], [4, 4, "+"], [7, 3, "−"]], ti = 0, d = 0, ok = 0, lock = 0;
function showT() {
  var t = T[ti];
  document.getElementById("task").textContent = t[2] === "+" ?
    ("Bir haltada " + t[0] + " kg, beýlekisinde " + t[1] + " kg haryt bar. Jemi näçe kilogram?") :
    ("Haltada " + t[0] + " kg haryt bardy, " + t[1] + " kg alyndy. Näçe kilogram galdy?");
  document.getElementById("tmsg").className = "msg";
  document.getElementById("tmsg").textContent = "";
  lock = 0;
}
var h = "";
for (var i = 2; i <= 10; i++) h += '<button class="btn" data-n="' + i + '">' + i + "</button>";
document.getElementById("nums").innerHTML = h;
var nb = document.getElementById("nums").getElementsByTagName("button");
for (var i = 0; i < nb.length; i++) {
  nb[i].onclick = function () {
    if (lock) return;
    lock = 1; d++;
    var v = parseInt(this.getAttribute("data-n"), 10), t = T[ti];
    var r = t[2] === "+" ? t[0] + t[1] : t[0] - t[1], m = document.getElementById("tmsg");
    if (v === r) { ok++; m.className = "msg ok"; m.textContent = "Dogry! " + t[0] + " " + t[2] + " " + t[1] + " = " + r + " kg."; }
    else { m.className = "msg bad"; m.textContent = "Ýalňyş. Dogry jogap: " + r + " kg."; }
    document.getElementById("tsc").textContent = "Netije: " + ok + " / " + d;
  };
}
document.getElementById("tnext").onclick = function () { ti = (ti + 1) % T.length; showT(); };
showT();

var Q = [
  ["Kilogram näme ölçemekde ulanylýar?", ["Agram", "Uzynlyk", "Wagt"], 0],
  ["Kilogram nähili gysgaldylýar?", ["kg", "sm", "l"], 0],
  ["2 kg alma bilen 3 kg armydyň jemi agramy näçe?", ["5 kg", "1 kg", "6 kg"], 0]
];
var qd = 0, qok = 0, hh = "";
for (var i = 0; i < Q.length; i++) {
  hh += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
  for (var j = 0; j < Q[i][1].length; j++) hh += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
  hh += '</div><div class="msg" id="qm' + i + '"></div></div>';
}
document.getElementById("quiz").innerHTML = hh;
var qb = document.getElementById("quiz").getElementsByTagName("button");
for (var i = 0; i < qb.length; i++) {
  qb[i].onclick = function () {
    var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
    var m = document.getElementById("qm" + k);
    if (m.getAttribute("data-done")) return;
    m.setAttribute("data-done", "1"); qd++;
    if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
    document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
  };
}
</script>
</body>
</html>
