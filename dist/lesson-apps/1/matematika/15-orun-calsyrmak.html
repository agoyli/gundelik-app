<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goşulyjylaryň orunlaryny çalşyrmak — 1-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .eq { text-align: center; font-size: 27px; font-weight: 700; margin: 8px 0; }
  .beads { background: #f7fafd; border-radius: 12px; padding: 9px; font-size: 24px; text-align: center; min-height: 40px; }
  .nums { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .nums button { min-height: 46px; font-size: 18px; font-weight: 700; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Goşulyjylaryň orunlaryny çalşyrmak</h1>
  <div class="sub">Matematika · 1-nji synp</div>

  <div class="card">
    <div class="def"><b>Goşulyjylaryň orunlary çalşyrylanda jem üýtgemeýär.</b>
      Şonuň üçin uly sandan başlap goşmak amatlydyr.</div>
  </div>

  <div class="card">
    <h3>Orunlary çalşyryp gör</h3>
    <div class="beads" id="b1"></div>
    <div class="eq" id="eq"></div>
    <div class="beads" id="b2"></div>
    <div class="row">
      <button class="btn primary" id="swap">Orunlary çalyş</button>
      <button class="btn ghost" id="new">Täze mysal</button>
    </div>
    <div class="msg ok" id="smsg"></div>
  </div>

  <div class="card">
    <h3>Jübüt mysalyň jogabyny tap</h3>
    <div class="eq" id="task"></div>
    <div class="nums" id="nums"></div>
    <div class="msg" id="tmsg"></div>
    <div class="row"><button class="btn primary" id="next">Indiki mysal</button></div>
    <div class="score" id="tsc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Matematika 1, I kitap · 85-nji sahypa</div>
</div>

<script>
var P = [[2, 6], [3, 5], [1, 7], [4, 4], [2, 8]], pi = 0, a = 2, b = 6;
function beads(n, e) { var s = ""; for (var i = 0; i < n; i++) s += e; return s; }
function show() {
  document.getElementById("b1").textContent = beads(a, "🔵") + " + " + beads(b, "🟠");
  document.getElementById("eq").textContent = a + " + " + b + " = " + (a + b);
  document.getElementById("b2").textContent = beads(b, "🟠") + " + " + beads(a, "🔵");
  document.getElementById("smsg").textContent =
    a + " + " + b + " = " + (a + b) + " we " + b + " + " + a + " = " + (b + a) + " – jem üýtgemedi.";
}
document.getElementById("swap").onclick = function () { var t = a; a = b; b = t; show(); };
document.getElementById("new").onclick = function () {
  pi = (pi + 1) % P.length; a = P[pi][0]; b = P[pi][1]; show();
};
show();

var T = [[3, 5], [2, 7], [1, 8], [4, 5], [6, 3], [2, 6]];
var ti = 0, d = 0, ok = 0, lock = 0;
function showT() {
  var t = T[ti];
  document.getElementById("task").textContent = t[0] + " + " + t[1] + " = " + (t[0] + t[1]) + ",   onda   " + t[1] + " + " + t[0] + " = ?";
  document.getElementById("tmsg").className = "msg";
  document.getElementById("tmsg").textContent = "";
  lock = 0;
}
var h = "";
for (var i = 6; i <= 10; i++) h += '<button class="btn" data-n="' + i + '">' + i + "</button>";
document.getElementById("nums").innerHTML = h;
var nb = document.getElementById("nums").getElementsByTagName("button");
for (var i = 0; i < nb.length; i++) {
  nb[i].onclick = function () {
    if (lock) return;
    lock = 1; d++;
    var v = parseInt(this.getAttribute("data-n"), 10), s = T[ti][0] + T[ti][1], m = document.getElementById("tmsg");
    if (v === s) { ok++; m.className = "msg ok"; m.textContent = "Dogry! Orunlar çalşanda jem üýtgemeýär."; }
    else { m.className = "msg bad"; m.textContent = "Ýalňyş. Jem şol bir – " + s + "."; }
    document.getElementById("tsc").textContent = "Netije: " + ok + " / " + d;
  };
}
document.getElementById("next").onclick = function () { ti = (ti + 1) % T.length; showT(); };
showT();

var Q = [
  ["Goşulyjylaryň orunlary çalşyrylanda jem nähili bolýar?", ["Üýtgemeýär", "Kiçelýär", "Ulalýar"], 0],
  ["4 + 5 = 9 bolsa, 5 + 4 näçe?", ["9", "8", "10"], 0],
  ["1 + 8 mysalyny nädip aňsat hasaplamaly?", ["8 + 1 görnüşinde", "8 − 1 görnüşinde", "1 − 8 görnüşinde"], 0]
];
var qd = 0, qok = 0, hh = "";
for (var i = 0; i < Q.length; i++) {
  hh += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
  for (var j = 0; j < Q[i][1].length; j++) hh += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
  hh += '</div><div class="msg" id="qm' + i + '"></div></div>';
}
document.getElementById("quiz").innerHTML = hh;
var qb = document.getElementById("quiz").getElementsByTagName("button");
for (var i = 0; i < qb.length; i++) {
  qb[i].onclick = function () {
    var k = parseInt(this.getAttribute("data-q"), 10), an = parseInt(this.getAttribute("data-a"), 10);
    var m = document.getElementById("qm" + k);
    if (m.getAttribute("data-done")) return;
    m.setAttribute("data-done", "1"); qd++;
    if (an === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
    document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
  };
}
</script>
</body>
</html>
