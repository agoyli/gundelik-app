<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>20-niň alnyşy. Sanlaryň ikinji onlugy — 1-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .bundle { background: #f7fafd; border-radius: 13px; padding: 11px; text-align: center; font-size: 26px; min-height: 52px; line-height: 1.4; }
  .big2 { text-align: center; font-size: 38px; font-weight: 700; }
  .say { background: #eef3fb; border-radius: 12px; padding: 10px; font-size: 16px; line-height: 1.6; min-height: 44px; }
  .nums { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .nums button { min-height: 46px; font-size: 17px; font-weight: 700; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>20-niň alnyşy. Sanlaryň ikinji onlugy</h1>
  <div class="sub">Matematika · 1-nji synp</div>

  <div class="card">
    <div class="def">On bilen bir – <b>on bir</b>. <b>11 – bu 1 onluk hem-de 1 birlik.</b>
      On bilen on – <b>ýigrimi</b>. <b>20 – bu 2 onluk.</b></div>
  </div>

  <div class="card">
    <h3>Onluk we birlik ýygna</h3>
    <div class="bundle" id="bundle"></div>
    <div class="big2" id="num">10</div>
    <div class="say" id="say"></div>
    <div class="row">
      <button class="btn primary" id="p1">+ 1 birlik</button>
      <button class="btn" id="m1">− 1 birlik</button>
      <button class="btn ghost" id="rs">10-a gaýt</button>
    </div>
  </div>

  <div class="card">
    <h3>Näçe onluk, näçe birlik?</h3>
    <div class="big2" id="task"></div>
    <div class="goal">Birlikleriň sanyna bas.</div>
    <div class="nums" id="nums"></div>
    <div class="msg" id="tmsg"></div>
    <div class="row"><button class="btn primary" id="next">Indiki san</button></div>
    <div class="score" id="tsc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Matematika 1, II kitap · 16–37-nji sahypalar</div>
</div>

<script>
var NAMES = ["on", "on bir", "on iki", "on üç", "on dört", "on bäş", "on alty",
             "on ýedi", "on sekiz", "on dokuz", "ýigrimi"];
var n = 10;
function show() {
  var tens = Math.floor(n / 10), ones = n % 10, h = "";
  for (var i = 0; i < tens; i++) h += "🟫";
  for (var i = 0; i < ones; i++) h += "▮";
  document.getElementById("bundle").textContent = h;
  document.getElementById("num").textContent = n;
  var s = document.getElementById("say");
  if (n === 20) s.innerHTML = "<b>20</b> – bu <b>2 onluk</b>. Ady: <b>ýigrimi</b>.";
  else if (n === 10) s.innerHTML = "<b>10</b> – bu <b>1 onluk</b>. Ady: <b>on</b>.";
  else s.innerHTML = "<b>" + n + "</b> – bu <b>1 onluk</b> hem-de <b>" + (n % 10) +
    " birlik</b>. Ady: <b>" + NAMES[n - 10] + "</b>.";
}
document.getElementById("p1").onclick = function () { if (n < 20) n++; show(); };
document.getElementById("m1").onclick = function () { if (n > 10) n--; show(); };
document.getElementById("rs").onclick = function () { n = 10; show(); };
show();

var T = [13, 17, 11, 15, 19, 12], ti = 0, d = 0, ok = 0, lock = 0;
function showT() {
  document.getElementById("task").textContent = T[ti];
  document.getElementById("tmsg").className = "msg";
  document.getElementById("tmsg").textContent = "";
  lock = 0;
}
var h = "";
for (var i = 0; i <= 9; i++) h += '<button class="btn" data-n="' + i + '">' + i + "</button>";
document.getElementById("nums").innerHTML = h;
var nb = document.getElementById("nums").getElementsByTagName("button");
for (var i = 0; i < nb.length; i++) {
  nb[i].onclick = function () {
    if (lock) return;
    lock = 1; d++;
    var v = parseInt(this.getAttribute("data-n"), 10), r = T[ti] % 10, m = document.getElementById("tmsg");
    if (v === r) { ok++; m.className = "msg ok"; m.textContent = "Dogry! " + T[ti] + " – 1 onluk we " + r + " birlik."; }
    else { m.className = "msg bad"; m.textContent = "Ýalňyş. " + T[ti] + " sanynda " + r + " birlik bar."; }
    document.getElementById("tsc").textContent = "Netije: " + ok + " / " + d;
  };
}
document.getElementById("next").onclick = function () { ti = (ti + 1) % T.length; showT(); };
showT();

var Q = [
  ["11 sany nämeden durýar?", ["1 onluk we 1 birlik", "2 onluk", "11 onluk"], 0],
  ["10 + 6 näçe bolar?", ["16", "10", "60"], 0],
  ["20 sany näçe onlukdan durýar?", ["2", "1", "20"], 0],
  ["Haýsy san birbelgili?", ["7", "12", "20"], 0]
];
var qd = 0, qok = 0, hh = "";
for (var i = 0; i < Q.length; i++) {
  hh += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
  for (var j = 0; j < Q[i][1].length; j++) hh += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
  hh += '</div><div class="msg" id="qm' + i + '"></div></div>';
}
document.getElementById("quiz").innerHTML = hh;
var qb = document.getElementById("quiz").getElementsByTagName("button");
for (var i = 0; i < qb.length; i++) {
  qb[i].onclick = function () {
    var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
    var m = document.getElementById("qm" + k);
    if (m.getAttribute("data-done")) return;
    m.setAttribute("data-done", "1"); qd++;
    if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
    document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
  };
}
</script>
</body>
</html>
