<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perimetr düşünjesi — 3-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .board { background: #f7fafd; border-radius: 13px; padding: 10px; }
  .board svg { display: block; width: 100%; height: auto; max-height: 180px; }
  .ways { background: #fff6e0; border-radius: 12px; padding: 12px; font-size: 16.5px; line-height: 1.9; }
  .nums { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .nums button { min-height: 46px; font-size: 16px; font-weight: 700; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Perimetr düşünjesi</h1>
  <div class="sub">Matematika · 3-nji synp</div>

  <div class="card">
    <div class="def">Köpburçlugyň <b>hemme tarapynyň uzynlygynyň jemine</b> onuň
      <b>perimetri</b> diýilýär.</div>
  </div>

  <div class="card">
    <h3>Gönüburçlugyň perimetri – üç usul</h3>
    <div class="board"><svg id="bd" viewBox="0 0 300 170"></svg></div>
    <div class="ways" id="ways" style="margin-top:8px"></div>
    <div class="goal">Perimetri saýla.</div>
    <div class="nums" id="nums"></div>
    <div class="msg" id="tmsg"></div>
    <div class="row"><button class="btn primary" id="next">Indiki gönüburçluk</button></div>
    <div class="score" id="tsc"></div>
  </div>

  <div class="card">
    <h3>Ters mesele</h3>
    <div class="goal" id="rgoal"></div>
    <div class="nums" id="rnums"></div>
    <div class="msg" id="rmsg"></div>
    <div class="row"><button class="btn ghost" id="rnext">Indiki sorag</button></div>
    <div class="score" id="rsc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Matematika 3, II kitap · 56–58-nji sahypalar</div>
</div>

<script>
var R = [[5, 4], [6, 4], [7, 2], [8, 5], [6, 6]], ri = 0, d = 0, ok = 0, lock = 0;
function per() { return (R[ri][0] + R[ri][1]) * 2; }
function draw() {
  var u = R[ri][0], i2 = R[ri][1], w = u * 24, hgt = i2 * 18;
  var x = (300 - w) / 2, y = (140 - hgt) / 2 + 10;
  var s = '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + hgt + '" fill="#f7d9e6" stroke="#b0407a" stroke-width="4"/>';
  s += '<text x="' + (x + w / 2) + '" y="' + (y - 8) + '" font-size="15" text-anchor="middle" fill="#1e2a3a">' + u + ' sm</text>';
  s += '<text x="' + (x + w / 2) + '" y="' + (y + hgt + 20) + '" font-size="15" text-anchor="middle" fill="#1e2a3a">' + u + ' sm</text>';
  s += '<text x="' + (x - 8) + '" y="' + (y + hgt / 2 + 5) + '" font-size="15" text-anchor="end" fill="#1e2a3a">' + i2 + ' sm</text>';
  s += '<text x="' + (x + w + 8) + '" y="' + (y + hgt / 2 + 5) + '" font-size="15" fill="#1e2a3a">' + i2 + ' sm</text>';
  document.getElementById("bd").innerHTML = s;
  document.getElementById("ways").innerHTML =
    "1-nji usul: " + u + " + " + i2 + " + " + u + " + " + i2 + " = ?<br>" +
    "2-nji usul: " + u + " · 2 + " + i2 + " · 2 = ?<br>" +
    "3-nji usul: (" + u + " + " + i2 + ") · 2 = ?";
  document.getElementById("tmsg").className = "msg";
  document.getElementById("tmsg").textContent = "";
  lock = 0;
}
var VALS = [14, 16, 18, 20, 22, 24, 26, 28, 30, 36];
var h = "";
for (var i = 0; i < VALS.length; i++) h += '<button class="btn" data-n="' + VALS[i] + '">' + VALS[i] + "</button>";
document.getElementById("nums").innerHTML = h;
var nb = document.getElementById("nums").getElementsByTagName("button");
for (var i = 0; i < nb.length; i++) {
  nb[i].onclick = function () {
    if (lock) return;
    lock = 1; d++;
    var v = parseInt(this.getAttribute("data-n"), 10), r = per(), u = R[ri][0], i2 = R[ri][1];
    var m = document.getElementById("tmsg");
    if (v === r) { ok++; m.className = "msg ok"; m.textContent = "Dogry! (" + u + " + " + i2 + ") · 2 = " + r + " sm."; }
    else { m.className = "msg bad"; m.textContent = "Ýalňyş. (" + u + " + " + i2 + ") · 2 = " + r + " sm."; }
    document.getElementById("ways").innerHTML =
      "1-nji usul: " + u + " + " + i2 + " + " + u + " + " + i2 + " = " + r + " sm<br>" +
      "2-nji usul: " + u + " · 2 + " + i2 + " · 2 = " + (u * 2) + " + " + (i2 * 2) + " = " + r + " sm<br>" +
      "3-nji usul: (" + u + " + " + i2 + ") · 2 = " + (u + i2) + " · 2 = " + r + " sm";
    document.getElementById("tsc").textContent = "Netije: " + ok + " / " + d;
  };
}
document.getElementById("next").onclick = function () { ri = (ri + 1) % R.length; draw(); };
draw();

// [perimetr, kwadratyň tarapy]
var K = [[20, 5], [16, 4], [12, 3], [32, 8], [24, 6]], ki = 0, rd = 0, rok = 0, rlock = 0;
function showK() {
  document.getElementById("rgoal").textContent =
    "Kwadratyň perimetri " + K[ki][0] + " sm. Onuň tarapy näçe santimetr?";
  document.getElementById("rmsg").className = "msg";
  document.getElementById("rmsg").textContent = "";
  rlock = 0;
}
var h2 = "";
for (var i = 2; i <= 11; i++) h2 += '<button class="btn" data-n="' + i + '">' + i + "</button>";
document.getElementById("rnums").innerHTML = h2;
var rb = document.getElementById("rnums").getElementsByTagName("button");
for (var i = 0; i < rb.length; i++) {
  rb[i].onclick = function () {
    if (rlock) return;
    rlock = 1; rd++;
    var v = parseInt(this.getAttribute("data-n"), 10), w = K[ki][1], m = document.getElementById("rmsg");
    var yaz = K[ki][0] + " : 4 = " + w;
    if (v === w) { rok++; m.className = "msg ok"; m.textContent = "Dogry! " + yaz + " sm."; }
    else { m.className = "msg bad"; m.textContent = "Ýalňyş. " + yaz + " sm."; }
    document.getElementById("rsc").textContent = "Netije: " + rok + " / " + rd;
  };
}
document.getElementById("rnext").onclick = function () { ki = (ki + 1) % K.length; showK(); };
showK();

var Q = [
  ["Köpburçlugyň hemme tarapynyň uzynlygynyň jemine näme diýilýär?", ["Perimetr", "Uzynlyk", "In"], 0],
  ["Uzynlygy 5 sm, ini 4 sm bolan gönüburçlugyň perimetri näçe?", ["18 sm", "20 sm", "9 sm"], 0],
  ["Perimetri 20 sm bolan kwadratyň tarapy näçe?", ["5 sm", "4 sm", "10 sm"], 0]
];
var qd = 0, qok = 0, hh = "";
for (var i = 0; i < Q.length; i++) {
  hh += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
  for (var j = 0; j < Q[i][1].length; j++) hh += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
  hh += '</div><div class="msg" id="qm' + i + '"></div></div>';
}
document.getElementById("quiz").innerHTML = hh;
var qb = document.getElementById("quiz").getElementsByTagName("button");
for (var i = 0; i < qb.length; i++) {
  qb[i].onclick = function () {
    var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
    var m = document.getElementById("qm" + k);
    if (m.getAttribute("data-done")) return;
    m.setAttribute("data-done", "1"); qd++;
    if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
    document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
  };
}
</script>
</body>
</html>
