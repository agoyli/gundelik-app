<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paýy saýlap almak — 4-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .eq { background: #fff6e0; border-radius: 13px; padding: 14px; text-align: center; font-size: 26px; font-weight: 800; }
  .chain { background: #f7fafd; border-radius: 12px; padding: 11px; font-size: 17px; line-height: 1.9; text-align: center; }
  .nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .nums button { min-height: 48px; font-size: 18px; font-weight: 800; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Üçbelgili sana bölmekde sanlary tegelekläp, paýy saýlap almak usuly</h1>
  <div class="sub">Matematika · 4-nji synp</div>

  <div class="card">
    <div class="def">Bölünýäni we bölüjini <b>tegelekläp</b> paýy çaklaýarys, soňra ony
      bölüjä köpeldip <b>barlaýarys</b>: 868 : 217 → 800 : 200 = 4, 217 · 4 = 868.</div>
  </div>

  <div class="card">
    <h3>Paýy saýla we barla</h3>
    <div class="eq" id="eq"></div>
    <div class="chain" id="chain" style="margin-top:8px"></div>
    <div class="goal" id="ask"></div>
    <div class="nums" id="nums"></div>
    <div class="msg" id="msg"></div>
    <div class="row">
      <button class="btn primary" id="next">Indiki mysal</button>
      <button class="btn ghost" id="again">Täzeden</button>
    </div>
    <div class="score" id="sc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Matematika 4, II kitap · 75–77-nji sahypalar</div>
</div>

<script>
// [bölünýän, bölüji, tegelek bölünýän, tegelek bölüji]
var T = [
  [868, 217, 800, 200],
  [1512, 168, 1500, 150],
  [612, 153, 600, 150],
  [1904, 238, 2000, 250],
  [735, 245, 750, 250]
];
var ti = 0, stage = 0, d = 0, ok = 0;
function payy() { return T[ti][0] / T[ti][1]; }
function show() {
  var t = T[ti];
  document.getElementById("eq").textContent = t[0] + " : " + t[1] + " = ?";
  var cak = Math.round(t[2] / t[3]);
  var l = "Çaklama: " + t[2] + " : " + t[3] + " ≈ " + cak;
  if (stage >= 1) {
    if (cak !== payy()) l += "<br>Çaklama takyk däl, ony düzedýäris.";
    l += "<br>Barla: " + t[1] + " · " + payy() + " = " + t[0] + " ✓";
  }
  document.getElementById("chain").innerHTML = l;
  document.getElementById("ask").textContent = stage === 0 ?
    "Çaklanan paýy saýla, ol dogry bolsa barlag görkeziler." : "Mysal çözüldi.";
  var m = document.getElementById("msg");
  m.className = stage >= 1 ? "msg ok" : "msg";
  m.textContent = stage >= 1 ? (t[0] + " : " + t[1] + " = " + payy() + ".") : "";
}
var h = "";
for (var i = 2; i <= 9; i++) h += '<button class="btn" data-n="' + i + '">' + i + "</button>";
document.getElementById("nums").innerHTML = h;
var nb = document.getElementById("nums").getElementsByTagName("button");
for (var i = 0; i < nb.length; i++) {
  nb[i].onclick = function () {
    if (stage >= 1) return;
    var v = parseInt(this.getAttribute("data-n"), 10), t = T[ti], m = document.getElementById("msg");
    d++;
    if (v === payy()) { ok++; stage = 1; show(); }
    else {
      m.className = "msg bad";
      m.textContent = "Barla: " + t[1] + " · " + v + " = " + (t[1] * v) +
        (t[1] * v > t[0] ? " – köp. Paýy kiçelt." : " – az. Paýy ulalt.");
    }
    document.getElementById("sc").textContent = "Netije: " + ok + " / " + d;
  };
}
document.getElementById("next").onclick = function () { ti = (ti + 1) % T.length; stage = 0; show(); };
document.getElementById("again").onclick = function () { stage = 0; show(); };
show();

var Q = [
  ["868 : 217 näçe bolar?", ["4", "3", "5"], 0],
  ["Saýlanan paýy nädip barlamaly?", ["Bölüjä köpeltmeli", "Bölünýäne köpeltmeli", "Bölüjä bölmeli"], 0],
  ["Bölüji · paý bölünýänden uly çyksa näme etmeli?", ["Paýy kiçeltmeli", "Paýy ulaltmaly", "Bölüjini ulaltmaly"], 0]
];
var qd = 0, qok = 0, hh = "";
for (var i = 0; i < Q.length; i++) {
  hh += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
  for (var j = 0; j < Q[i][1].length; j++) hh += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
  hh += '</div><div class="msg" id="qm' + i + '"></div></div>';
}
document.getElementById("quiz").innerHTML = hh;
var qb = document.getElementById("quiz").getElementsByTagName("button");
for (var i = 0; i < qb.length; i++) {
  qb[i].onclick = function () {
    var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
    var m = document.getElementById("qm" + k);
    if (m.getAttribute("data-done")) return;
    m.setAttribute("data-done", "1"); qd++;
    if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
    document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
  };
}
</script>
</body>
</html>
