<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10 san içinde goşmak we aýyrmak — 1-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .eq { text-align: center; font-size: 30px; font-weight: 700; margin: 9px 0 4px; }
  .nums { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .nums button { min-height: 46px; font-size: 18px; font-weight: 700; }
  .pairs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .pairs button { min-height: 46px; font-size: 16px; font-weight: 700; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>10 san içinde goşmak we aýyrmak</h1>
  <div class="sub">Matematika · 1-nji synp</div>

  <div class="card">
    <div class="def">Goşmagy <b>aýyrmak</b> bilen, aýyrmagy bolsa <b>goşmak</b> bilen
      barlap bolýar. <b>Nol goşulanda san üýtgemeýär.</b></div>
  </div>

  <div class="card">
    <h3>10-yň düzümi</h3>
    <div class="goal">10-y düzýän jübüti tap: 10 = ? + <span id="need">?</span></div>
    <div class="pairs" id="pairs"></div>
    <div class="msg" id="pmsg"></div>
    <div class="row"><button class="btn primary" id="pnext">Indiki jübüt</button></div>
    <div class="score" id="psc"></div>
  </div>

  <div class="card">
    <h3>Çalt hasapla</h3>
    <div class="eq" id="task"></div>
    <div class="nums" id="nums"></div>
    <div class="msg" id="tmsg"></div>
    <div class="row"><button class="btn primary" id="next">Indiki mysal</button></div>
    <div class="score" id="tsc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Matematika 1, II kitap · 110–113-nji sahypalar</div>
</div>

<script>
var NEED = [3, 6, 8, 2, 5, 7], pi = 0, pd = 0, pok = 0, plock = 0;
function showP() {
  document.getElementById("need").textContent = NEED[pi];
  var h = "";
  for (var i = 1; i <= 9; i++) h += '<button class="btn" data-n="' + i + '">' + i + "</button>";
  document.getElementById("pairs").innerHTML = h;
  var bs = document.getElementById("pairs").getElementsByTagName("button");
  for (var k = 0; k < bs.length; k++) bs[k].onclick = pclick;
  document.getElementById("pmsg").className = "msg";
  document.getElementById("pmsg").textContent = "";
  plock = 0;
}
function pclick() {
  if (plock) return;
  plock = 1; pd++;
  var v = parseInt(this.getAttribute("data-n"), 10), r = 10 - NEED[pi], m = document.getElementById("pmsg");
  if (v === r) { pok++; m.className = "msg ok"; m.textContent = "Dogry! " + r + " + " + NEED[pi] + " = 10."; }
  else { m.className = "msg bad"; m.textContent = "Ýalňyş. Dogry jogap: " + r + "."; }
  document.getElementById("psc").textContent = "Netije: " + pok + " / " + pd;
}
document.getElementById("pnext").onclick = function () { pi = (pi + 1) % NEED.length; showP(); };
showP();

var T = [[6, "+", 4], [9, "−", 3], [5, "+", 0], [10, "−", 6], [7, "+", 2], [8, "−", 8], [3, "+", 5], [10, "−", 1]];
var ti = 0, d = 0, ok = 0, lock = 0;
function val() { var t = T[ti]; return t[1] === "+" ? t[0] + t[2] : t[0] - t[2]; }
function showT() {
  var t = T[ti];
  document.getElementById("task").textContent = t[0] + " " + t[1] + " " + t[2] + " = ?";
  document.getElementById("tmsg").className = "msg";
  document.getElementById("tmsg").textContent = "";
  lock = 0;
}
var h = "";
for (var i = 0; i <= 10; i++) h += '<button class="btn" data-n="' + i + '">' + i + "</button>";
document.getElementById("nums").innerHTML = h;
var nb = document.getElementById("nums").getElementsByTagName("button");
for (var i = 0; i < nb.length; i++) {
  nb[i].onclick = function () {
    if (lock) return;
    lock = 1; d++;
    var v = parseInt(this.getAttribute("data-n"), 10), r = val(), t = T[ti], m = document.getElementById("tmsg");
    if (v === r) {
      ok++; m.className = "msg ok";
      m.textContent = "Dogry! Barlaýarys: " + (t[1] === "+" ? r + " − " + t[2] + " = " + t[0] : r + " + " + t[2] + " = " + t[0]) + ".";
    } else { m.className = "msg bad"; m.textContent = "Ýalňyş. Dogry jogap: " + r + "."; }
    document.getElementById("tsc").textContent = "Netije: " + ok + " / " + d;
  };
}
document.getElementById("next").onclick = function () { ti = (ti + 1) % T.length; showT(); };
showT();

var Q = [
  ["6 + 4 näçe bolar?", ["10", "9", "11"], 0],
  ["9 + 0 näçe bolar?", ["9", "0", "10"], 0],
  ["10 − 6 näçe bolar?", ["4", "5", "3"], 0]
];
var qd = 0, qok = 0, hh = "";
for (var i = 0; i < Q.length; i++) {
  hh += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
  for (var j = 0; j < Q[i][1].length; j++) hh += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
  hh += '</div><div class="msg" id="qm' + i + '"></div></div>';
}
document.getElementById("quiz").innerHTML = hh;
var qb = document.getElementById("quiz").getElementsByTagName("button");
for (var i = 0; i < qb.length; i++) {
  qb[i].onclick = function () {
    var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
    var m = document.getElementById("qm" + k);
    if (m.getAttribute("data-done")) return;
    m.setAttribute("data-done", "1"); qd++;
    if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
    document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
  };
}
</script>
</body>
</html>
