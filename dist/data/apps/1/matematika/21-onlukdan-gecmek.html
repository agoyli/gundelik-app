<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onlukdan geçmek — 1-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .frame { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
  .frame div { background: #f2f5fa; border-radius: 6px; min-height: 28px; }
  .frame div.a { background: #4a7fd4; }
  .frame div.b { background: #e0a13a; }
  .frame div.c { background: #c1622a; }
  .eq { text-align: center; font-size: 25px; font-weight: 700; margin: 9px 0 4px; }
  .nums { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .nums button { min-height: 46px; font-size: 18px; font-weight: 700; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Onlukdan geçmek</h1>
  <div class="sub">Matematika · 1-nji synp</div>

  <div class="card">
    <div class="def">Ilki <b>10-y doldurýarys</b>, soňra galanyny goşýarys:<br>
      <b>6 + 5 = 6 + 4 + 1 = 10 + 1 = 11</b></div>
  </div>

  <div class="card">
    <h3>10-y doldur</h3>
    <div class="eq" id="eq"></div>
    <div class="frame" id="f1"></div>
    <div class="frame" id="f2" style="margin-top:5px"></div>
    <div class="goal" style="margin-top:8px" id="ask"></div>
    <div class="nums" id="nums"></div>
    <div class="msg" id="fmsg"></div>
    <div class="row"><button class="btn primary" id="next">Indiki mysal</button></div>
    <div class="score" id="fsc"></div>
  </div>

  <div class="card">
    <h3>Doly çözüwi gör</h3>
    <div class="eq" id="full"></div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Matematika 1, II kitap · 47–49-njy sahypalar</div>
</div>

<script>
var T = [[6, 5], [9, 3], [7, 5], [8, 4], [7, 6]], ti = 0, d = 0, ok = 0, lock = 0;
function cells(id, a, b, c) {
  var h = "";
  for (var i = 0; i < 10; i++) {
    var cl = i < a ? "a" : (i < a + b ? "b" : "");
    h += '<div class="' + cl + '"></div>';
  }
  document.getElementById(id).innerHTML = h;
  var h2 = "";
  for (var i = 0; i < 10; i++) h2 += '<div class="' + (i < c ? "c" : "") + '"></div>';
  document.getElementById("f2").innerHTML = h2;
}
function show() {
  var t = T[ti], a = t[0], b = t[1];
  document.getElementById("eq").textContent = a + " + " + b + " = ?";
  document.getElementById("ask").textContent = a + " sanyna näçe goşsak 10 bolar?";
  cells("f1", a, 0, 0);
  document.getElementById("full").textContent = "";
  document.getElementById("hint").textContent = "";
  document.getElementById("fmsg").className = "msg";
  document.getElementById("fmsg").textContent = "";
  lock = 0;
}
var h = "";
for (var i = 1; i <= 5; i++) h += '<button class="btn" data-n="' + i + '">' + i + "</button>";
document.getElementById("nums").innerHTML = h;
var nb = document.getElementById("nums").getElementsByTagName("button");
for (var i = 0; i < nb.length; i++) {
  nb[i].onclick = function () {
    if (lock) return;
    var v = parseInt(this.getAttribute("data-n"), 10), t = T[ti], a = t[0], b = t[1];
    var need = 10 - a, rest = b - need, m = document.getElementById("fmsg");
    lock = 1; d++;
    if (v === need) {
      ok++; m.className = "msg ok";
      m.textContent = "Dogry! " + a + " + " + need + " = 10. " + b + " sanyndan " + need + " alnanda " + rest + " galýar.";
      cells("f1", a, need, rest);
      document.getElementById("full").textContent =
        a + " + " + b + " = " + a + " + " + need + " + " + rest + " = 10 + " + rest + " = " + (a + b);
      document.getElementById("hint").textContent = "Jogap: " + (a + b) + ".";
    } else {
      m.className = "msg bad";
      m.textContent = "Ýalňyş. " + a + " sanyna " + need + " goşsak 10 bolýar.";
    }
    document.getElementById("fsc").textContent = "Netije: " + ok + " / " + d;
  };
}
document.getElementById("next").onclick = function () { ti = (ti + 1) % T.length; show(); };
show();

var Q = [
  ["6 + 5 näçe bolar?", ["11", "10", "12"], 0],
  ["9 + 3 mysalynda 3 sany nähili bölünýär?", ["1 we 2", "3 we 3", "2 we 2"], 0],
  ["7 + 4 näçe bolar?", ["11", "10", "12"], 0]
];
var qd = 0, qok = 0, hh = "";
for (var i = 0; i < Q.length; i++) {
  hh += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
  for (var j = 0; j < Q[i][1].length; j++) hh += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
  hh += '</div><div class="msg" id="qm' + i + '"></div></div>';
}
document.getElementById("quiz").innerHTML = hh;
var qb = document.getElementById("quiz").getElementsByTagName("button");
for (var i = 0; i < qb.length; i++) {
  qb[i].onclick = function () {
    var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
    var m = document.getElementById("qm" + k);
    if (m.getAttribute("data-done")) return;
    m.setAttribute("data-done", "1"); qd++;
    if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
    document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
  };
}
</script>
</body>
</html>
