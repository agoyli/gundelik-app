<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanyň drobuny tapmak — 4-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .bar { background: #f7fafd; border-radius: 13px; padding: 10px; }
  .bar svg { display: block; width: 100%; height: auto; max-height: 110px; }
  .frac { background: #fff6e0; border-radius: 13px; padding: 12px; text-align: center; font-size: 19px; font-weight: 700; line-height: 1.7; }
  .fr { display: inline-block; text-align: center; vertical-align: middle; margin: 0 4px; }
  .fr .up { display: block; border-bottom: 3px solid #1e2a3a; padding: 0 8px 2px; }
  .fr .dn { display: block; padding-top: 2px; }
  .nums { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .nums button { min-height: 46px; font-size: 17px; font-weight: 700; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sanyň drobuny tapmak</h1>
  <div class="sub">Matematika · 4-nji synp</div>

  <div class="card">
    <div class="def">Sanyň drobuny tapmak üçin, ol sany <b>maýdalawja bölmeli</b> we alnan
      paýy <b>sanawja köpeltmeli</b>. Drob çyzygynyň aşagyndaky san – maýdalawjy,
      ýokarsyndaky san – sanawjy.</div>
  </div>

  <div class="card">
    <h3>Iki ädimde tap</h3>
    <div class="frac" id="frac"></div>
    <div class="bar"><svg id="bar" viewBox="0 0 320 100"></svg></div>
    <div class="goal" id="ask" style="margin-top:8px"></div>
    <div class="nums" id="nums"></div>
    <div class="msg" id="tmsg"></div>
    <div class="row">
      <button class="btn primary" id="next">Indiki mysal</button>
      <button class="btn ghost" id="again">Täzeden</button>
    </div>
    <div class="score" id="tsc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Matematika 4, I kitap · 18–24-nji sahypalar</div>
</div>

<script>
// [san, sanawjy, maýdalawjy]
var T = [[24, 3, 4], [40, 2, 5], [36, 2, 9], [30, 5, 6], [28, 3, 7]];
var ti = 0, stage = 0, d = 0, ok = 0;
function num() { return T[ti][0]; }
function up() { return T[ti][1]; }
function dn() { return T[ti][2]; }
function part() { return num() / dn(); }
function res() { return part() * up(); }
function draw() {
  var n = dn(), w = 300 / n, s = "";
  for (var i = 0; i < n; i++) {
    var on = stage >= 2 && i < up();
    s += '<rect x="' + (10 + i * w) + '" y="20" width="' + (w - 4) + '" height="52" rx="6" fill="' +
      (on ? "#c9e6d3" : "#eef4fb") + '" stroke="' + (on ? "#2b7a4a" : "#94aec9") + '" stroke-width="2"/>';
    s += '<text x="' + (10 + i * w + (w - 4) / 2) + '" y="52" font-size="14" text-anchor="middle" fill="#1e2a3a">' +
      (stage >= 1 ? part() : "?") + "</text>";
  }
  document.getElementById("bar").innerHTML = s;
  document.getElementById("frac").innerHTML =
    num() + " sanyň <span class=\"fr\"><span class=\"up\">" + up() + "</span><span class=\"dn\">" + dn() +
    "</span></span> bölegi näçe?";
  document.getElementById("ask").textContent = stage === 0 ?
    ("1-nji ädim: " + num() + " : " + dn() + " näçe bolar?") :
    (stage === 1 ? ("2-nji ädim: " + part() + " · " + up() + " näçe bolar?") : "Mysal çözüldi.");
  var m = document.getElementById("tmsg");
  m.className = stage === 2 ? "msg ok" : "msg";
  m.textContent = stage === 2 ?
    ("Jogap: " + num() + " : " + dn() + " · " + up() + " = " + res() + ".") : "";
}
var h = "";
for (var i = 2; i <= 26; i++) h += '<button class="btn" data-n="' + i + '">' + i + "</button>";
document.getElementById("nums").innerHTML = h;
var nb = document.getElementById("nums").getElementsByTagName("button");
for (var i = 0; i < nb.length; i++) {
  nb[i].onclick = function () {
    if (stage >= 2) return;
    var v = parseInt(this.getAttribute("data-n"), 10), m = document.getElementById("tmsg");
    var w = stage === 0 ? part() : res();
    d++;
    if (v === w) {
      ok++; stage++; draw();
      if (stage === 1) { m.className = "msg ok"; m.textContent = "Dogry! Bir bölek tapyldy. Indi ony sanawja köpelt."; }
    } else {
      m.className = "msg bad";
      m.textContent = stage === 0 ? "Ýalňyş. Sany maýdalawja böl." : "Ýalňyş. Bir bölegi sanawja köpelt.";
    }
    document.getElementById("tsc").textContent = "Netije: " + ok + " / " + d;
  };
}
document.getElementById("next").onclick = function () { ti = (ti + 1) % T.length; stage = 0; draw(); };
document.getElementById("again").onclick = function () { stage = 0; draw(); };
draw();

var Q = [
  ["Sanyň drobuny tapmak üçin ilki näme etmeli?",
   ["Sany maýdalawja bölmeli", "Sany sanawja bölmeli", "Sany sanawja köpeltmeli"], 0],
  ["24-üň 3/4 bölegi näçe?", ["18", "6", "8"], 0],
  ["Drob çyzygynyň aşagyndaky sana näme diýilýär?", ["Maýdalawjy", "Sanawjy", "Paý"], 0]
];
var qd = 0, qok = 0, hh = "";
for (var i = 0; i < Q.length; i++) {
  hh += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
  for (var j = 0; j < Q[i][1].length; j++) hh += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
  hh += '</div><div class="msg" id="qm' + i + '"></div></div>';
}
document.getElementById("quiz").innerHTML = hh;
var qb = document.getElementById("quiz").getElementsByTagName("button");
for (var i = 0; i < qb.length; i++) {
  qb[i].onclick = function () {
    var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
    var m = document.getElementById("qm" + k);
    if (m.getAttribute("data-done")) return;
    m.setAttribute("data-done", "1"); qd++;
    if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
    document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
  };
}
</script>
</body>
</html>
