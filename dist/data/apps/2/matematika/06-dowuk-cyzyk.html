<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Döwük çyzygyň uzynlygy — 2-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .board { background: #f7fafd; border-radius: 13px; padding: 10px; }
  .board svg { display: block; width: 100%; height: auto; max-height: 190px; }
  .chain { background: #fff6e0; border-radius: 12px; padding: 11px; font-size: 18px; font-weight: 700; text-align: center; }
  .nums { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .nums button { min-height: 46px; font-size: 17px; font-weight: 700; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Döwük çyzygyň uzynlygyny tapmak</h1>
  <div class="sub">Matematika · 2-nji synp</div>

  <div class="card">
    <div class="def">Döwük çyzygyň her bölegini <b>kesim</b> hasaplamak bolýar.
      Onuň uzynlygyny tapmak üçin şol kesimleriň uzynlyklaryny <b>goşmaly</b>.</div>
  </div>

  <div class="card">
    <h3>Uzynlygyny hasapla</h3>
    <div class="board"><svg id="bd" viewBox="0 0 320 170"></svg></div>
    <div class="chain" id="chain" style="margin-top:8px"></div>
    <div class="goal">Jemi näçe sm? Sana bas.</div>
    <div class="nums" id="nums"></div>
    <div class="msg" id="tmsg"></div>
    <div class="row">
      <button class="btn primary" id="next">Indiki çyzyk</button>
      <button class="btn ghost" id="hint">Bölekleri sana</button>
    </div>
    <div class="score" id="tsc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Matematika 2, II kitap · 18–19-njy sahypalar</div>
</div>

<script>
// Her döwük çyzyk – kesimleriň uzynlyklary (sm) we nokatlaryň ýerleşişi
var T = [
  { len: [3, 1, 2], pts: [[20, 130], [98, 40], [124, 118], [176, 30]] },
  { len: [2, 3], pts: [[30, 120], [82, 40], [160, 130]] },
  { len: [2, 2, 4], pts: [[20, 40], [72, 120], [124, 40], [228, 130]] },
  { len: [4, 1, 3], pts: [[20, 130], [124, 44], [150, 120], [228, 34]] }
];
var ti = 0, d = 0, ok = 0, lock = 0;
function sum() {
  var s = 0, L = T[ti].len;
  for (var i = 0; i < L.length; i++) s += L[i];
  return s;
}
function draw() {
  var t = T[ti], s = "", p = t.pts;
  for (var i = 0; i < p.length - 1; i++) {
    s += '<line x1="' + p[i][0] + '" y1="' + p[i][1] + '" x2="' + p[i + 1][0] + '" y2="' + p[i + 1][1] +
      '" stroke="#2456b0" stroke-width="4" stroke-linecap="round"/>';
    var mx = (p[i][0] + p[i + 1][0]) / 2, my = (p[i][1] + p[i + 1][1]) / 2;
    s += '<rect x="' + (mx - 20) + '" y="' + (my - 13) + '" width="40" height="22" rx="6" fill="#fff" stroke="#2456b0" stroke-width="1"/>';
    s += '<text x="' + mx + '" y="' + (my + 3) + '" font-size="13" text-anchor="middle" fill="#1e2a3a">' + t.len[i] + ' sm</text>';
  }
  for (var i = 0; i < p.length; i++) s += '<circle cx="' + p[i][0] + '" cy="' + p[i][1] + '" r="5" fill="#1e2a3a"/>';
  document.getElementById("bd").innerHTML = s;
  document.getElementById("chain").textContent = t.len.join(" + ") + " = ?";
  document.getElementById("tmsg").className = "msg";
  document.getElementById("tmsg").textContent = "";
  lock = 0;
}
var h = "";
for (var i = 3; i <= 14; i++) h += '<button class="btn" data-n="' + i + '">' + i + "</button>";
document.getElementById("nums").innerHTML = h;
var nb = document.getElementById("nums").getElementsByTagName("button");
for (var i = 0; i < nb.length; i++) {
  nb[i].onclick = function () {
    if (lock) return;
    lock = 1; d++;
    var v = parseInt(this.getAttribute("data-n"), 10), r = sum(), m = document.getElementById("tmsg");
    if (v === r) { ok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Ýalňyş. Dogry jogap: " + r + " sm."; }
    document.getElementById("chain").textContent = T[ti].len.join(" + ") + " = " + r + " sm";
    document.getElementById("tsc").textContent = "Netije: " + ok + " / " + d;
  };
}
document.getElementById("next").onclick = function () { ti = (ti + 1) % T.length; draw(); };
document.getElementById("hint").onclick = function () {
  var m = document.getElementById("tmsg");
  m.className = "msg";
  m.textContent = "Bu döwük çyzykda " + T[ti].len.length + " sany kesim bar.";
};
draw();

var Q = [
  ["Döwük çyzygyň uzynlygyny nädip tapmaly?", ["Kesimleriniň uzynlyklaryny goşmaly", "Iň uzyn kesimi almaly", "Kesimleriň sanyny aýtmaly"], 0],
  ["2 sm we 1 sm kesimlerden düzülen döwük çyzygyň uzynlygy näçe?", ["3 sm", "2 sm", "1 sm"], 0],
  ["Döwük çyzygyň her bölegine näme diýilýär?", ["Kesim", "Burç", "Nokat"], 0]
];
var qd = 0, qok = 0, hh = "";
for (var i = 0; i < Q.length; i++) {
  hh += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
  for (var j = 0; j < Q[i][1].length; j++) hh += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
  hh += '</div><div class="msg" id="qm' + i + '"></div></div>';
}
document.getElementById("quiz").innerHTML = hh;
var qb = document.getElementById("quiz").getElementsByTagName("button");
for (var i = 0; i < qb.length; i++) {
  qb[i].onclick = function () {
    var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
    var m = document.getElementById("qm" + k);
    if (m.getAttribute("data-done")) return;
    m.setAttribute("data-done", "1"); qd++;
    if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
    document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
  };
}
</script>
</body>
</html>
