<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>«Kempir» şahasy — 7-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .stage { background: #f6faf4; border-radius: 13px; padding: 6px; }
  .stage svg { display: block; width: 100%; height: auto; }
  .info { background: #fdfaf2; border-radius: 12px; padding: 11px 13px; font-size: 16px; line-height: 1.7; min-height: 62px; }
  .pool { display: grid; gap: 7px; }
  .pool button { min-height: 48px; font-size: 15px; font-weight: 700; text-align: left; padding: 8px 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { min-height: 44px; font-size: 15px; font-weight: 700; padding: 6px 12px; }
  .lines { display: grid; gap: 6px; }
  .lines button { min-height: 46px; font-size: 15.5px; font-weight: 600; text-align: left; padding: 8px 12px; }
  .r0 { background: #dbeafe !important; }
  .r1 { background: #dcfce7 !important; }
  .r2 { background: #fee2e2 !important; }
  .done { background: #dff2e3; border-radius: 12px; padding: 10px 12px; font-size: 15.5px; line-height: 1.7; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>«Kempir» şahasy</h1>
  <div class="sub">Edebiýat · 7-nji synp</div>

  <div class="card">
    <div class="def">Gyratyň ogurlanmagyna Göroglynyň <b>sadalygy, ynanjaňlygy we rehimliligi</b> sebäp bolýar; ahyrynda pähim ýeňýär.</div>
  </div>

  <div class="card">
    <h3>Wakanyň çyzygyny gur</h3>
    <div class="goal" id="agoal"></div>
    <div class="stage"><svg id="asvg" viewBox="0 0 320 170"></svg></div>
    <div class="pool" id="apool"></div>
    <div class="msg" id="amsg"></div>
    <div class="row"><button class="btn ghost" id="areset">Täzeden başla</button></div>
    <div class="score" id="asc"></div>
  </div>

  <div class="card">
    <h3>Deňeşdirmäni tap</h3>
    <div class="goal">Deňeşdirme aňladýan sözüň yzyna degip belle.</div>
    <div class="chips" id="mwords"></div>
    <div class="info" id="mline"></div>
    <div class="row"><button class="btn primary" id="mcheck">Barla</button>
      <button class="btn ghost" id="mclear">Arassala</button></div>
    <div class="msg" id="mmsg"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Edebiýat 7 · 6-njy tema</div>
</div>
<script>

var AS = [["baglanyş", "Mekir kempir Göroglynyň ýanyna barýar"], ["ösüş", "Görogly onuň hilesine ynanýar"], ["ýokary nokat", "Gyrat ogurlanýar"], ["çözüliş", "Görogly çykalga tapyp, aryny alýar"]];
(function () {
  var PT = [[34, 128], [110, 96], [196, 44], [286, 118]];
  var next = 0, tries = 0;
  function draw() {
    var s = '<rect x="0" y="0" width="320" height="170" fill="#f6faf4"/>';
    s += '<path d="M 34 128 C 90 118, 120 106, 196 44 C 240 60, 262 96, 286 118" ' +
         'stroke="#9bb08c" stroke-width="3" fill="none"/>';
    for (var i = 0; i < 4; i++) {
      var on = i < next;
      s += '<circle cx="' + PT[i][0] + '" cy="' + PT[i][1] + '" r="' + (on ? 9 : 6) +
           '" fill="' + (on ? "#1d6f3c" : "#c9d6bd") + '" stroke="#4a6b39" stroke-width="2"/>';
      s += '<text x="' + PT[i][0] + '" y="' + (PT[i][1] - 15) + '" font-size="10.5" ' +
           'fill="#2f4a22" text-anchor="middle">' + AS[i][0] + '</text>';
      if (on) s += '<text x="' + PT[i][0] + '" y="' + (PT[i][1] + 22) + '" font-size="9" ' +
                   'fill="#14522b" text-anchor="middle">✓</text>';
    }
    document.getElementById("asvg").innerHTML = s;
    var h = "";
    for (var k = 0; k < 4; k++) {
      if (k < next) continue;
      h += '<button class="btn" data-i="' + k + '">' + AS[k][1] + "</button>";
    }
    document.getElementById("apool").innerHTML = h;
    var bs = document.getElementById("apool").getElementsByTagName("button");
    for (var k = 0; k < bs.length; k++) bs[k].onclick = pick;
    document.getElementById("agoal").textContent = next < 4 ?
      ("«" + AS[next][0] + "» basgançagyna haýsy waka gelýär?") :
      "Wakanyň çyzygy doly guruldy!";
    document.getElementById("asc").textContent = "Basgançak: " + next + " / 4 · synanyşyk: " + tries;
  }
  function pick() {
    var i = parseInt(this.getAttribute("data-i"), 10), m = document.getElementById("amsg");
    tries++;
    if (i === next) {
      next++;
      m.className = "msg ok";
      m.textContent = next === 4 ? "Çyzyk doly!" : "Dogry!";
    } else {
      m.className = "msg bad";
      m.textContent = "Bu waka «" + AS[i][0] + "» basgançagyna degişli.";
    }
    draw();
  }
  document.getElementById("areset").onclick = function () {
    next = 0; tries = 0;
    document.getElementById("amsg").className = "msg";
    document.getElementById("amsg").textContent = "";
    draw();
  };
  draw();
})();

var MW = ["agzy", "ojak", "kimin,", "dişleri", "kepje", "kimin"], MT = [2, 5], MN = "«Kimin» sözi deňeşdirmäniň nyşanydyr.";
(function () {
  var st = [];
  for (var i = 0; i < MW.length; i++) st.push(0);
  function render() {
    var h = "";
    for (var i = 0; i < MW.length; i++) {
      var c = st[i] === 1 ? " sel" : "";
      h += '<button class="btn' + c + '" data-i="' + i + '">' + MW[i] +
           (st[i] === 1 ? " |" : "") + "</button>";
    }
    document.getElementById("mwords").innerHTML = h;
    var bs = document.getElementById("mwords").getElementsByTagName("button");
    for (var k = 0; k < bs.length; k++) {
      bs[k].onclick = function () {
        var i = parseInt(this.getAttribute("data-i"), 10);
        st[i] = st[i] ? 0 : 1;
        render();
      };
    }
    var t = "";
    for (var i = 0; i < MW.length; i++) t += MW[i] + (st[i] === 1 ? " | " : " ");
    document.getElementById("mline").textContent = t;
  }
  document.getElementById("mcheck").onclick = function () {
    var ok = 1;
    for (var i = 0; i < MW.length; i++) if (st[i] !== (MT.indexOf(i) >= 0 ? 1 : 0)) ok = 0;
    var m = document.getElementById("mmsg");
    if (ok) { m.className = "msg ok"; m.textContent = "Dogry! " + MN; }
    else { m.className = "msg bad"; m.textContent = "Entek dogry däl. " + MN; }
  };
  document.getElementById("mclear").onclick = function () {
    for (var i = 0; i < MW.length; i++) st[i] = 0;
    render();
    document.getElementById("mmsg").className = "msg";
    document.getElementById("mmsg").textContent = "";
  };
  render();
})();

var Q = [["Gyratyň ogurlanmagyna näme sebäp bolýar?", ["Göroglynyň sadalygy", "Uruş", "Guraklyk"], 0], ["Kempiriň keşbi haýsy serişde bilen berlipdir?", ["Deňeşdirme bilen", "Sanlar bilen", "Nakyl bilen"], 0], ["Görogly ahyrynda näme edýär?", ["Kempirden aryny alýar", "Ýurduny taşlaýar", "Gyratyny satýar"], 0]];
(function () {
  var qd = 0, qok = 0, h = "";
  for (var i = 0; i < Q.length; i++) {
    h += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
    for (var j = 0; j < Q[i][1].length; j++)
      h += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
    h += '</div><div class="msg" id="qm' + i + '"></div></div>';
  }
  document.getElementById("quiz").innerHTML = h;
  var bs = document.getElementById("quiz").getElementsByTagName("button");
  for (var i = 0; i < bs.length; i++) {
    bs[i].onclick = function () {
      var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
      var m = document.getElementById("qm" + k);
      if (m.getAttribute("data-done")) return;
      m.setAttribute("data-done", "1"); qd++;
      if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
      else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
      document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
    };
  }
})();
</script>
</body>
</html>
