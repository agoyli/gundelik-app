<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taraplaryň uzynlyklarynyň jemi — 3-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .board { background: #f7fafd; border-radius: 13px; padding: 10px; }
  .board svg { display: block; width: 100%; height: auto; max-height: 190px; }
  .chain { background: #fff6e0; border-radius: 12px; padding: 11px; font-size: 17px; font-weight: 700; text-align: center; }
  .nums { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .nums button { min-height: 46px; font-size: 16px; font-weight: 700; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Üçburçlugyň, gönüburçlugyň we kwadratyň taraplarynyň jemi</h1>
  <div class="sub">Matematika · 3-nji synp</div>

  <div class="card">
    <div class="def">Ähli taraplaryň uzynlyklary <b>goşulýar</b>. Kwadratda taraplar deň
      bolany üçin bir tarapy <b>4-e köpeltmek</b> hem bolýar.</div>
  </div>

  <div class="card">
    <h3>Taraplaryň jemini tap</h3>
    <div class="board"><svg id="bd" viewBox="0 0 300 180"></svg></div>
    <div class="chain" id="chain" style="margin-top:8px"></div>
    <div class="goal">Jemi näçe? Sana bas.</div>
    <div class="nums" id="nums"></div>
    <div class="msg" id="tmsg"></div>
    <div class="row">
      <button class="btn primary" id="next">Indiki şekil</button>
      <button class="btn ghost" id="hint">Kömek</button>
    </div>
    <div class="score" id="tsc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Matematika 3, II kitap · 55–56-njy sahypalar</div>
</div>

<script>
// kind: kwadrat | gonuburcluk | ucburcluk
var F = [
  { kind: "kwadrat", a: 8 },
  { kind: "gonuburcluk", a: 5, b: 4 },
  { kind: "ucburcluk", s: [6, 8, 10] },
  { kind: "kwadrat", a: 3 },
  { kind: "gonuburcluk", a: 7, b: 3 },
  { kind: "ucburcluk", s: [5, 5, 8] }
];
var fi = 0, d = 0, ok = 0, lock = 0;
function sides() {
  var f = F[fi];
  if (f.kind === "kwadrat") return [f.a, f.a, f.a, f.a];
  if (f.kind === "gonuburcluk") return [f.a, f.b, f.a, f.b];
  return f.s;
}
function sum() {
  var s = sides(), t = 0;
  for (var i = 0; i < s.length; i++) t += s[i];
  return t;
}
function draw() {
  var f = F[fi], s = "";
  if (f.kind === "ucburcluk") {
    s += '<polygon points="40,150 150,26 260,150" fill="#f5e6db" stroke="#c1622a" stroke-width="4"/>';
    s += '<text x="86" y="80" font-size="15" fill="#1e2a3a">' + f.s[0] + ' sm</text>';
    s += '<text x="208" y="80" font-size="15" fill="#1e2a3a">' + f.s[1] + ' sm</text>';
    s += '<text x="150" y="170" font-size="15" text-anchor="middle" fill="#1e2a3a">' + f.s[2] + ' sm</text>';
  } else {
    var side2 = f.kind === "kwadrat" ? f.a : f.b;
    var w = f.a * 20, hgt = side2 * 20;
    var x = (300 - w) / 2, y = (150 - hgt) / 2 + 10;
    var fill = f.kind === "kwadrat" ? "#dff0e4" : "#dbe6f5";
    var st = f.kind === "kwadrat" ? "#2b7a4a" : "#2456b0";
    s += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + hgt + '" fill="' + fill + '" stroke="' + st + '" stroke-width="4"/>';
    s += '<text x="' + (x + w / 2) + '" y="' + (y - 8) + '" font-size="15" text-anchor="middle" fill="#1e2a3a">' + f.a + ' sm</text>';
    s += '<text x="' + (x - 8) + '" y="' + (y + hgt / 2 + 5) + '" font-size="15" text-anchor="end" fill="#1e2a3a">' + side2 + ' sm</text>';
  }
  document.getElementById("bd").innerHTML = s;
  document.getElementById("chain").textContent = sides().join(" + ") + " = ?";
  document.getElementById("tmsg").className = "msg";
  document.getElementById("tmsg").textContent = "";
  lock = 0;
}
var VALS = [12, 16, 18, 20, 24, 26, 28, 30, 32, 36];
var h = "";
for (var i = 0; i < VALS.length; i++) h += '<button class="btn" data-n="' + VALS[i] + '">' + VALS[i] + "</button>";
document.getElementById("nums").innerHTML = h;
var nb = document.getElementById("nums").getElementsByTagName("button");
for (var i = 0; i < nb.length; i++) {
  nb[i].onclick = function () {
    if (lock) return;
    lock = 1; d++;
    var v = parseInt(this.getAttribute("data-n"), 10), r = sum(), f = F[fi], m = document.getElementById("tmsg");
    var extra = f.kind === "kwadrat" ? (" Kwadratda " + f.a + " · 4 = " + r + " sm hem ýazyp bolýar.") : "";
    if (v === r) { ok++; m.className = "msg ok"; m.textContent = "Dogry! " + r + " sm." + extra; }
    else { m.className = "msg bad"; m.textContent = "Ýalňyş. Dogry jogap: " + r + " sm." + extra; }
    document.getElementById("chain").textContent = sides().join(" + ") + " = " + r + " sm";
    document.getElementById("tsc").textContent = "Netije: " + ok + " / " + d;
  };
}
document.getElementById("next").onclick = function () { fi = (fi + 1) % F.length; draw(); };
document.getElementById("hint").onclick = function () {
  var m = document.getElementById("tmsg");
  m.className = "msg";
  m.textContent = "Şekiliň " + sides().length + " tarapy bar – hemmesini goş.";
};
draw();

var Q = [
  ["Tarapy 3 sm bolan kwadratyň taraplarynyň jemi näçe?", ["12 sm", "9 sm", "6 sm"], 0],
  ["Gönüburçlugyň taraplarynyň jemi nädip tapylýar?", ["Dört tarapyň hemmesini goşup", "Diňe uzynlygyny alyp", "Uzynlygyny inine bölüp"], 0],
  ["Taraplary 20 m, 24 m, 25 m bolan üçburçlugyň taraplarynyň jemi näçe?", ["69 m", "68 m", "45 m"], 0]
];
var qd = 0, qok = 0, hh = "";
for (var i = 0; i < Q.length; i++) {
  hh += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
  for (var j = 0; j < Q[i][1].length; j++) hh += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
  hh += '</div><div class="msg" id="qm' + i + '"></div></div>';
}
document.getElementById("quiz").innerHTML = hh;
var qb = document.getElementById("quiz").getElementsByTagName("button");
for (var i = 0; i < qb.length; i++) {
  qb[i].onclick = function () {
    var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
    var m = document.getElementById("qm" + k);
    if (m.getAttribute("data-done")) return;
    m.setAttribute("data-done", "1"); qd++;
    if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
    document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
  };
}
</script>
</body>
</html>
