<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gije-gündiz, hepde, aý, ýyl — 3-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .mon { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .mon button { min-height: 46px; font-size: 14.5px; font-weight: 700; padding: 4px; }
  .nums { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .nums button { min-height: 46px; font-size: 16px; font-weight: 700; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Gije-gündiz, hepde, aý, ýyl</h1>
  <div class="sub">Matematika · 3-nji synp</div>

  <div class="card">
    <div class="def">Bir gije-gündiz <b>24 sagada</b> deňdir. Her <b>7 gün</b> 1 hepde bolýar.
      <b>30-31 gün</b> bir aýy düzýär. Bir ýylda <b>12 aý</b> bar.</div>
  </div>

  <div class="card">
    <h3>Aýlary tertip boýunça bas</h3>
    <div class="goal" id="ogoal"></div>
    <div class="mon" id="mon"></div>
    <div class="msg" id="omsg"></div>
    <div class="row"><button class="btn ghost" id="oreset">Täzeden</button></div>
    <div class="score" id="osc"></div>
  </div>

  <div class="card">
    <h3>Günlere geçir</h3>
    <div class="goal" id="dgoal"></div>
    <div class="nums" id="nums"></div>
    <div class="msg" id="dmsg"></div>
    <div class="row"><button class="btn primary" id="dnext">Indiki sorag</button></div>
    <div class="score" id="dsc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Matematika 3, I kitap · 118–122-nji sahypalar</div>
</div>

<script>
var MON = ["Ýanwar", "Fewral", "Mart", "Aprel", "Maý", "Iýun",
           "Iýul", "Awgust", "Sentýabr", "Oktýabr", "Noýabr", "Dekabr"];
var need = 0, od = 0, ook = 0;
function drawMon() {
  // aýlar garyşyk tertipde görkezilýär: ilki jübüt, soňra täk orunlylar
  var mix = [];
  for (var i = 0; i < 12; i += 2) mix.push(i);
  for (var i = 1; i < 12; i += 2) mix.push(i);
  var h = "";
  for (var k = 0; k < mix.length; k++) h += '<button class="btn" data-i="' + mix[k] + '">' + MON[mix[k]] + "</button>";
  document.getElementById("mon").innerHTML = h;
  var bs = document.getElementById("mon").getElementsByTagName("button");
  for (var j = 0; j < bs.length; j++) bs[j].onclick = mclick;
  need = 0;
  document.getElementById("ogoal").textContent = "1-nji aýa bas: " + (need + 1) + "-nji aý.";
  document.getElementById("omsg").className = "msg";
  document.getElementById("omsg").textContent = "";
}
function mclick() {
  var i = parseInt(this.getAttribute("data-i"), 10), m = document.getElementById("omsg");
  if (this.getAttribute("data-done")) return;
  od++;
  if (i === need) {
    ook++; need++;
    this.setAttribute("data-done", "1");
    this.className = "btn sel";
    if (need === 12) { m.className = "msg ok"; m.textContent = "Ähli 12 aý tertip boýunça tapyldy! 🎉"; }
    else { m.className = "msg ok"; m.textContent = "Dogry! Indi " + (need + 1) + "-nji aýa bas."; }
    document.getElementById("ogoal").textContent = need < 12 ?
      ((need + 1) + "-nji aýa bas.") : "Ýyl doly tamamlandy.";
  } else {
    m.className = "msg bad";
    m.textContent = "Ýalňyş. " + MON[i] + " – " + (i + 1) + "-nji aý.";
  }
  document.getElementById("osc").textContent = "Netije: " + ook + " / " + od;
}
document.getElementById("oreset").onclick = drawMon;
drawMon();

var D = [[3, 0], [2, 2], [1, 5], [4, 0], [2, 6]], di = 0, dd = 0, dok = 0, dlock = 0;
function dwant() { return D[di][0] * 7 + D[di][1]; }
function showD() {
  document.getElementById("dgoal").textContent = D[di][1] === 0 ?
    (D[di][0] + " hepde näçe gün edýär?") :
    (D[di][0] + " hepde " + D[di][1] + " gün näçe gün edýär?");
  document.getElementById("dmsg").className = "msg";
  document.getElementById("dmsg").textContent = "";
  dlock = 0;
}
var h2 = "";
for (var i = 7; i <= 30; i++) h2 += '<button class="btn" data-n="' + i + '">' + i + "</button>";
document.getElementById("nums").innerHTML = h2;
var db = document.getElementById("nums").getElementsByTagName("button");
for (var i = 0; i < db.length; i++) {
  db[i].onclick = function () {
    if (dlock) return;
    dlock = 1; dd++;
    var v = parseInt(this.getAttribute("data-n"), 10), w = dwant(), m = document.getElementById("dmsg");
    var yaz = D[di][0] + " · 7" + (D[di][1] ? (" + " + D[di][1]) : "") + " = " + w;
    if (v === w) { dok++; m.className = "msg ok"; m.textContent = "Dogry! " + yaz + " gün."; }
    else { m.className = "msg bad"; m.textContent = "Ýalňyş. " + yaz + " gün."; }
    document.getElementById("dsc").textContent = "Netije: " + dok + " / " + dd;
  };
}
document.getElementById("dnext").onclick = function () { di = (di + 1) % D.length; showD(); };
showD();

var Q = [
  ["Bir hepdede näçe gün bar?", ["7", "12", "24"], 0],
  ["Bir ýylda näçe aý bar?", ["12", "7", "365"], 0],
  ["Bir gije-gündiz näçe sagat?", ["24", "12", "60"], 0]
];
var qd = 0, qok = 0, hh = "";
for (var i = 0; i < Q.length; i++) {
  hh += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
  for (var j = 0; j < Q[i][1].length; j++) hh += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
  hh += '</div><div class="msg" id="qm' + i + '"></div></div>';
}
document.getElementById("quiz").innerHTML = hh;
var qb = document.getElementById("quiz").getElementsByTagName("button");
for (var i = 0; i < qb.length; i++) {
  qb[i].onclick = function () {
    var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
    var m = document.getElementById("qm" + k);
    if (m.getAttribute("data-done")) return;
    m.setAttribute("data-done", "1"); qd++;
    if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
    document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
  };
}
</script>
</body>
</html>
