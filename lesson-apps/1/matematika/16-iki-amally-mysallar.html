<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iki amally mysallar — 1-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .eq { text-align: center; font-size: 28px; font-weight: 700; margin: 9px 0 4px; }
  .eq .hl { background: #ffe9a8; border-radius: 7px; padding: 0 5px; }
  .stepbox { background: #f7fafd; border-radius: 12px; padding: 10px; font-size: 16px; line-height: 1.6; min-height: 44px; }
  .nums { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .nums button { min-height: 46px; font-size: 18px; font-weight: 700; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Iki amally mysallar</h1>
  <div class="sub">Matematika · 1-nji synp</div>

  <div class="card">
    <div class="def">Iki amally mysalda amallar <b>çepden saga</b> ýerine ýetirilýär:
      ilki birinji amal, soňra ikinji amal.</div>
  </div>

  <div class="card">
    <h3>Ädimme-ädim çöz</h3>
    <div class="eq" id="eq"></div>
    <div class="stepbox" id="step">«Birinji amal» düwmesine bas.</div>
    <div class="row">
      <button class="btn primary" id="s1">Birinji amal</button>
      <button class="btn" id="s2">Ikinji amal</button>
      <button class="btn ghost" id="new">Täze mysal</button>
    </div>
    <div class="msg" id="smsg"></div>
  </div>

  <div class="card">
    <h3>Özüň hasapla</h3>
    <div class="eq" id="task"></div>
    <div class="nums" id="nums"></div>
    <div class="msg" id="tmsg"></div>
    <div class="row"><button class="btn primary" id="next">Indiki mysal</button></div>
    <div class="score" id="tsc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Matematika 1, I kitap · 96–104-nji sahypalar</div>
</div>

<script>
var E = [[6, "−", 2, "+", 3], [5, "+", 4, "−", 1], [8, "−", 3, "+", 2], [4, "+", 5, "−", 6], [7, "−", 5, "+", 4]];
var ei = 0, stage = 0;
function calc(a, op, b) { return op === "+" ? a + b : a - b; }
function showE() {
  var e = E[ei];
  var mid = calc(e[0], e[1], e[2]);
  var full = calc(mid, e[3], e[4]);
  var h = "";
  if (stage === 0) h = e[0] + " " + e[1] + " " + e[2] + " " + e[3] + " " + e[4] + " = ?";
  else if (stage === 1) h = '<span class="hl">' + e[0] + " " + e[1] + " " + e[2] + "</span> " + e[3] + " " + e[4] + " = ?";
  else h = e[0] + " " + e[1] + " " + e[2] + " " + e[3] + " " + e[4] + " = " + full;
  document.getElementById("eq").innerHTML = h;
  var s = document.getElementById("step");
  if (stage === 0) s.textContent = "Mysala seret. Ilki çepdäki amaly ýerine ýetirmeli.";
  else if (stage === 1) s.innerHTML = "<b>1) " + e[0] + " " + e[1] + " " + e[2] + " = " + mid + "</b><br>Indi şu netijä ikinji amaly ulanýarys.";
  else s.innerHTML = "<b>1) " + e[0] + " " + e[1] + " " + e[2] + " = " + mid + "</b><br><b>2) " + mid + " " + e[3] + " " + e[4] + " = " + full + "</b><br>Jogap: " + full + ".";
}
document.getElementById("s1").onclick = function () {
  stage = 1; showE();
  var m = document.getElementById("smsg");
  m.className = "msg ok"; m.textContent = "Birinji amal ýerine ýetirildi.";
};
document.getElementById("s2").onclick = function () {
  var m = document.getElementById("smsg");
  if (stage === 0) { m.className = "msg bad"; m.textContent = "Ilki birinji amaly ýerine ýetir."; return; }
  stage = 2; showE();
  m.className = "msg ok"; m.textContent = "Mysal doly çözüldi.";
};
document.getElementById("new").onclick = function () {
  ei = (ei + 1) % E.length; stage = 0; showE();
  document.getElementById("smsg").className = "msg";
  document.getElementById("smsg").textContent = "";
};
showE();

var T = [[8, "−", 3, "+", 2], [4, "+", 5, "−", 2], [9, "−", 4, "+", 1], [3, "+", 6, "−", 4], [7, "+", 2, "−", 5], [6, "−", 2, "+", 3]];
var ti = 0, d = 0, ok = 0, lock = 0;
function ans() { var t = T[ti]; return calc(calc(t[0], t[1], t[2]), t[3], t[4]); }
function showT() {
  var t = T[ti];
  document.getElementById("task").textContent = t[0] + " " + t[1] + " " + t[2] + " " + t[3] + " " + t[4] + " = ?";
  document.getElementById("tmsg").className = "msg";
  document.getElementById("tmsg").textContent = "";
  lock = 0;
}
var h = "";
for (var i = 3; i <= 8; i++) h += '<button class="btn" data-n="' + i + '">' + i + "</button>";
document.getElementById("nums").innerHTML = h;
var nb = document.getElementById("nums").getElementsByTagName("button");
for (var i = 0; i < nb.length; i++) {
  nb[i].onclick = function () {
    if (lock) return;
    lock = 1; d++;
    var v = parseInt(this.getAttribute("data-n"), 10), r = ans(), t = T[ti];
    var mid = calc(t[0], t[1], t[2]), m = document.getElementById("tmsg");
    if (v === r) { ok++; m.className = "msg ok"; m.textContent = "Dogry! " + t[0] + " " + t[1] + " " + t[2] + " = " + mid + ", soňra " + mid + " " + t[3] + " " + t[4] + " = " + r + "."; }
    else { m.className = "msg bad"; m.textContent = "Ýalňyş. Ilki " + t[0] + " " + t[1] + " " + t[2] + " = " + mid + ", soňra jogap " + r + "."; }
    document.getElementById("tsc").textContent = "Netije: " + ok + " / " + d;
  };
}
document.getElementById("next").onclick = function () { ti = (ti + 1) % T.length; showT(); };
showT();

var Q = [
  ["8 − 3 + 2 näçe bolar?", ["7", "3", "9"], 0],
  ["Iki amally mysalda amallar haýsy tertipde edilýär?", ["Çepden saga", "Sagdan çepe", "Ilki goşmak"], 0],
  ["4 + 5 − 2 näçe bolar?", ["7", "9", "11"], 0],
  ["6 − 2 + 3 mysalynda birinji amalyň netijesi näçe?", ["4", "7", "9"], 0]
];
var qd = 0, qok = 0, hh = "";
for (var i = 0; i < Q.length; i++) {
  hh += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
  for (var j = 0; j < Q[i][1].length; j++) hh += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
  hh += '</div><div class="msg" id="qm' + i + '"></div></div>';
}
document.getElementById("quiz").innerHTML = hh;
var qb = document.getElementById("quiz").getElementsByTagName("button");
for (var i = 0; i < qb.length; i++) {
  qb[i].onclick = function () {
    var k = parseInt(this.getAttribute("data-q"), 10), an = parseInt(this.getAttribute("data-a"), 10);
    var m = document.getElementById("qm" + k);
    if (m.getAttribute("data-done")) return;
    m.setAttribute("data-done", "1"); qd++;
    if (an === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
    document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
  };
}
</script>
</body>
</html>
