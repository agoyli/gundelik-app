<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Öň, soň, ilki, soňra — 1-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .cards button { min-height: 82px; font-size: 12px; line-height: 1.25; }
  .cards .em { display: block; font-size: 26px; }
  .slot { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  .slot div { background: #f7fafd; border-radius: 11px; min-height: 62px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Öň, soň, ilki, soňra</h1>
  <div class="sub">Matematika · 1-nji synp</div>

  <div class="card">
    <div class="def">Wakalar wagt boýunça yzygiderlikde bolup geçýär: <b>ilki</b> biri,
      <b>soňra</b> beýlekisi.</div>
  </div>

  <div class="card">
    <h3>Yzygiderligi düz</h3>
    <div class="goal" id="goal"></div>
    <div class="cards" id="pool"></div>
    <div class="slot" id="slot"></div>
    <div class="msg" id="smsg"></div>
    <div class="row">
      <button class="btn primary" id="next">Başga waka</button>
      <button class="btn ghost" id="again">Täzeden</button>
    </div>
    <div class="score" id="ssc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Matematika 1, I kitap · 32-nji sahypa</div>
</div>

<script>
var SEQ = [
  ["Gowaçanyň ösüşi", [["Tohum", "🌱"], ["Ösümlik", "🌿"], ["Gunça", "🌸"], ["Hana", "🤍"]], [2, 0, 3, 1]],
  ["Çörek nädip bolýar?", [["Bugdaý", "🌾"], ["Un", "🥣"], ["Hamyr", "🫓"], ["Çörek", "🍞"]], [1, 3, 0, 2]],
  ["Ertirki gün tertibi", [["Turmak", "🛏"], ["Ýuwunmak", "🚿"], ["Ertirlik", "🥣"], ["Mekdep", "🎒"]], [3, 1, 2, 0]]
];
var si = 0, placed = [], d = 0, ok = 0;
function draw() {
  var s = SEQ[si];
  document.getElementById("goal").innerHTML = "<b>" + s[0] + "</b> – suratlary dogry tertipde bas.";
  var h = "";
  for (var k = 0; k < s[2].length; k++) {
    var i = s[2][k];
    if (placed.indexOf(i) >= 0) continue;
    h += '<button class="btn" data-i="' + i + '"><span class="em">' + s[1][i][1] + "</span>" + s[1][i][0] + "</button>";
  }
  document.getElementById("pool").innerHTML = h || '<div class="note">Hemmesi ýerleşdirildi.</div>';
  var bs = document.getElementById("pool").getElementsByTagName("button");
  for (var j = 0; j < bs.length; j++) bs[j].onclick = pick;
  var sh = "";
  for (var j = 0; j < s[1].length; j++) sh += "<div>" + (placed[j] !== undefined ? s[1][placed[j]][1] : (j + 1)) + "</div>";
  document.getElementById("slot").innerHTML = sh;
}
function pick() {
  var i = parseInt(this.getAttribute("data-i"), 10), s = SEQ[si], m = document.getElementById("smsg");
  d++;
  if (i === placed.length) {
    ok++; placed.push(i);
    m.className = "msg ok";
    m.textContent = placed.length === 1 ? "Dogry! Ilki – " + s[1][i][0] + "." :
      (placed.length === s[1].length ? "Berekella! Yzygiderlik doly dogry. 🎉" : "Dogry! Soňra – " + s[1][i][0] + ".");
  } else {
    m.className = "msg bad";
    m.textContent = "Ýalňyş. Bu waka soňrak bolýar. Ilki " + s[1][placed.length][0] + " gelmeli.";
  }
  document.getElementById("ssc").textContent = "Netije: " + ok + " / " + d;
  draw();
}
document.getElementById("next").onclick = function () { si = (si + 1) % SEQ.length; placed = []; draw(); document.getElementById("smsg").textContent = ""; document.getElementById("smsg").className = "msg"; };
document.getElementById("again").onclick = function () { placed = []; draw(); document.getElementById("smsg").textContent = ""; document.getElementById("smsg").className = "msg"; };
draw();

var Q = [
  ["Bugdaýdan çörek bolýar. Ilki näme?", ["Bugdaý", "Çörek", "Hamyr"], 0],
  ["«Soňra» sözi nämäni aňladýar?", ["Ondan soň bolýan wakany", "Ilkinji wakany", "Sag tarapy"], 0],
  ["Gün tertibinde ilki näme gelýär?", ["Ukudan turmak", "Mekdebe gitmek", "Ýatmak"], 0]
];
var qd = 0, qok = 0, h = "";
for (var i = 0; i < Q.length; i++) {
  h += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
  for (var j = 0; j < Q[i][1].length; j++) h += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
  h += '</div><div class="msg" id="qm' + i + '"></div></div>';
}
document.getElementById("quiz").innerHTML = h;
var qb = document.getElementById("quiz").getElementsByTagName("button");
for (var i = 0; i < qb.length; i++) {
  qb[i].onclick = function () {
    var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
    var m = document.getElementById("qm" + k);
    if (m.getAttribute("data-done")) return;
    m.setAttribute("data-done", "1"); qd++;
    if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
    document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
  };
}
</script>
</body>
</html>
