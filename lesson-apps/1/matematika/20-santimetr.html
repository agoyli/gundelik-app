<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santimetr — 1-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .lab { background: #f7fafd; border-radius: 12px; padding: 10px; }
  svg { display: block; width: 100%; height: auto; }
  .nums { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .nums button { min-height: 46px; font-size: 18px; font-weight: 700; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Santimetr</h1>
  <div class="sub">Matematika · 1-nji synp</div>

  <div class="card">
    <div class="def">Uzynlygy ölçemek üçin <b>santimetr</b> ölçeg birligi ulanylýar.
      Ol gysgaça <b>«sm»</b> görnüşinde ýazylýar. Ölçäniňde çyzgyjyň <b>0</b> belligi
      zadyň ujuna gelmeli.</div>
  </div>

  <div class="card">
    <h3>Kesimi ölç</h3>
    <div class="lab"><svg id="ruler" viewBox="0 0 320 110"></svg></div>
    <div class="goal" style="margin-top:8px">Kesimiň uzynlygyna bas (sm):</div>
    <div class="nums" id="nums"></div>
    <div class="msg" id="rmsg"></div>
    <div class="row"><button class="btn primary" id="next">Indiki kesim</button></div>
    <div class="score" id="rsc"></div>
  </div>

  <div class="card">
    <h3>Uzynlyklary goş</h3>
    <div class="goal" id="sumq"></div>
    <div class="nums" id="snums"></div>
    <div class="msg" id="smsg"></div>
    <div class="row"><button class="btn ghost" id="snext">Başga mysal</button></div>
    <div class="score" id="ssc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Matematika 1, II kitap · 44–46-njy sahypalar</div>
</div>

<script>
var L = [5, 3, 8, 6, 4], li = 0, d = 0, ok = 0, lock = 0;
function drawR() {
  var u = 30, s = '<rect x="10" y="10" width="300" height="34" fill="#f0e6c8" rx="4"/>';
  for (var i = 0; i <= 10; i++) {
    var x = 10 + i * u;
    s += '<line x1="' + x + '" y1="10" x2="' + x + '" y2="' + (i % 5 === 0 ? 30 : 22) + '" stroke="#5a4a2a" stroke-width="1.5"/>';
    s += '<text x="' + x + '" y="41" font-size="10" text-anchor="middle" fill="#5a4a2a">' + i + "</text>";
  }
  s += '<line x1="10" y1="72" x2="' + (10 + L[li] * u) + '" y2="72" stroke="#2456b0" stroke-width="6" stroke-linecap="round"/>';
  s += '<circle cx="10" cy="72" r="4" fill="#1e2a3a"/><circle cx="' + (10 + L[li] * u) + '" cy="72" r="4" fill="#1e2a3a"/>';
  s += '<text x="10" y="98" font-size="12" fill="#4a5a6a">Kesimiň bir ujy 0-yň deňinde dur.</text>';
  document.getElementById("ruler").innerHTML = s;
  document.getElementById("rmsg").className = "msg";
  document.getElementById("rmsg").textContent = "";
  lock = 0;
}
var h = "";
for (var i = 2; i <= 9; i++) h += '<button class="btn" data-n="' + i + '">' + i + "</button>";
document.getElementById("nums").innerHTML = h;
var nb = document.getElementById("nums").getElementsByTagName("button");
for (var i = 0; i < nb.length; i++) {
  nb[i].onclick = function () {
    if (lock) return;
    lock = 1; d++;
    var v = parseInt(this.getAttribute("data-n"), 10), m = document.getElementById("rmsg");
    if (v === L[li]) { ok++; m.className = "msg ok"; m.textContent = "Dogry! Kesimiň uzynlygy " + v + " sm."; }
    else { m.className = "msg bad"; m.textContent = "Ýalňyş. Kesimiň uzynlygy " + L[li] + " sm."; }
    document.getElementById("rsc").textContent = "Netije: " + ok + " / " + d;
  };
}
document.getElementById("next").onclick = function () { li = (li + 1) % L.length; drawR(); };
drawR();

var S = [[5, 2], [3, 4], [6, 3], [2, 7]], si = 0, sd = 0, sok = 0, slock = 0;
function showS() {
  document.getElementById("sumq").textContent = S[si][0] + " sm + " + S[si][1] + " sm = ? sm";
  document.getElementById("smsg").className = "msg";
  document.getElementById("smsg").textContent = "";
  slock = 0;
}
var hh = "";
for (var i = 5; i <= 10; i++) hh += '<button class="btn" data-n="' + i + '">' + i + "</button>";
document.getElementById("snums").innerHTML = hh;
var sb = document.getElementById("snums").getElementsByTagName("button");
for (var i = 0; i < sb.length; i++) {
  sb[i].onclick = function () {
    if (slock) return;
    slock = 1; sd++;
    var v = parseInt(this.getAttribute("data-n"), 10), r = S[si][0] + S[si][1], m = document.getElementById("smsg");
    if (v === r) { sok++; m.className = "msg ok"; m.textContent = "Dogry! Jemi " + r + " sm."; }
    else { m.className = "msg bad"; m.textContent = "Ýalňyş. Dogry jogap: " + r + " sm."; }
    document.getElementById("ssc").textContent = "Netije: " + sok + " / " + sd;
  };
}
document.getElementById("snext").onclick = function () { si = (si + 1) % S.length; showS(); };
showS();

var Q = [
  ["Uzynlygyň ölçeg birligi haýsy?", ["Santimetr", "Kilogram", "Litr"], 0],
  ["Santimetr nähili ýazylýar?", ["sm", "kg", "l"], 0],
  ["Ölçäniňde çyzgyjyň haýsy belligi zadyň ujuna gelmeli?", ["0", "1", "10"], 0]
];
var qd = 0, qok = 0, h3 = "";
for (var i = 0; i < Q.length; i++) {
  h3 += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
  for (var j = 0; j < Q[i][1].length; j++) h3 += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
  h3 += '</div><div class="msg" id="qm' + i + '"></div></div>';
}
document.getElementById("quiz").innerHTML = h3;
var qb = document.getElementById("quiz").getElementsByTagName("button");
for (var i = 0; i < qb.length; i++) {
  qb[i].onclick = function () {
    var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
    var m = document.getElementById("qm" + k);
    if (m.getAttribute("data-done")) return;
    m.setAttribute("data-done", "1"); qd++;
    if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
    document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
  };
}
</script>
</body>
</html>
