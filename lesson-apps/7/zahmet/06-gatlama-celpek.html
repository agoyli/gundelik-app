<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ýagly gatlama, çelpek, pişme — 7-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .stage { background: #f6faf4; border-radius: 13px; padding: 6px; }
  .stage svg { display: block; width: 100%; height: auto; }
  .info { background: #fdfaf2; border-radius: 12px; padding: 11px 13px; font-size: 16px; line-height: 1.7; min-height: 62px; }
  .pool { display: grid; gap: 7px; }
  .pool button { min-height: 48px; font-size: 15px; font-weight: 700; text-align: left; padding: 8px 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { min-height: 44px; font-size: 15px; font-weight: 700; padding: 6px 12px; }
  .lines { display: grid; gap: 6px; }
  .lines button { min-height: 46px; font-size: 15.5px; font-weight: 600; text-align: left; padding: 8px 12px; }
  .r0 { background: #dbeafe !important; }
  .r1 { background: #dcfce7 !important; }
  .r2 { background: #fee2e2 !important; }
  .done { background: #dff2e3; border-radius: 12px; padding: 10px 12px; font-size: 15.5px; line-height: 1.7; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ýagly gatlama, çelpek, pişme</h1>
  <div class="sub">Zähmet · 7-nji synp</div>

  <div class="card">
    <div class="def">Gatlakly hamyrmaýasyz edilýär: hamyr 1 mm galyňlykda ýaýylýar, ýaglanyp eplenýär, soňunda 0,3 sm galyňlykda täzeden ýaýylýar.</div>
  </div>

  <div class="card">
    <h3>Gatlaklynyň gatlary</h3>
    <div class="goal" id="lgoal"></div>
    <div class="stage"><svg id="lsvg" viewBox="0 0 320 150"></svg></div>
    <div class="pool" id="lpool"></div>
    <div class="msg" id="lmsg"></div>
    <div class="row"><button class="btn ghost" id="lreset">Täzeden başla</button></div>
    <div class="score" id="lsc"></div>
  </div>

  <div class="card">
    <h3>Pişmäniň bişirilişi</h3>
    <div class="goal" id="ogoal"></div>
    <div class="pool" id="opool"></div>
    <div class="msg" id="omsg"></div>
    <div class="done" id="odone" style="display:none"></div>
    <div class="row"><button class="btn ghost" id="oreset">Täzeden başla</button></div>
    <div class="score" id="osc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Hojalyk-durmuş zähmeti 7 · 6-njy tema</div>
</div>
<script>

var LB = "<rect x=\"40\" y=\"40\" width=\"240\" height=\"70\" fill=\"#f5e6c8\" stroke=\"#a9884f\" stroke-width=\"2\"/><text x=\"160\" y=\"130\" font-size=\"11\" fill=\"#2f4a22\" text-anchor=\"middle\">hamyryň bir bölegi</text>", LS = [["1 mm galyňlykda ýaýmak", "<rect x=\"40\" y=\"60\" width=\"240\" height=\"30\" fill=\"#f7efdc\" stroke=\"#a9884f\" stroke-width=\"1.5\"/><text x=\"160\" y=\"79\" font-size=\"10\" fill=\"#6b5320\" text-anchor=\"middle\">1 mm</text>", "Her bölek 1 mm galyňlykda ýaýylýar."], ["Ýüzüne ýag çalmak", "<rect x=\"40\" y=\"60\" width=\"240\" height=\"30\" fill=\"#fdf3c9\" stroke=\"#d1a53a\" stroke-width=\"1.5\"/>", "Ýaglanan ýüz gatlaryň biri-birine ýelmeşmezligini üpjün edýär."], ["Eplemek", "<rect x=\"100\" y=\"55\" width=\"120\" height=\"40\" fill=\"#f2e2bd\" stroke=\"#a9884f\" stroke-width=\"1.5\"/><line x1=\"100\" y1=\"55\" x2=\"100\" y2=\"95\" stroke=\"#8a6a34\" stroke-width=\"2\"/><line x1=\"220\" y1=\"55\" x2=\"220\" y2=\"95\" stroke=\"#8a6a34\" stroke-width=\"2\"/>", "Ýaglanan hamyr eplenýär – şeýdip gatlar döreýär."], ["Togalak görnüşe getirmek", "<circle cx=\"160\" cy=\"75\" r=\"30\" fill=\"#eddcb4\" stroke=\"#a9884f\" stroke-width=\"2\"/>", "Ýag çalyp epläbermeli, tä togalak görnüşe gelýänçä."], ["0,3 sm galyňlykda täzeden ýaýmak", "<rect x=\"55\" y=\"62\" width=\"210\" height=\"26\" fill=\"#f7efdc\" stroke=\"#a9884f\" stroke-width=\"1.5\"/><text x=\"160\" y=\"79\" font-size=\"10\" fill=\"#6b5320\" text-anchor=\"middle\">0,3 sm</text>", "Soňky ýaýym 0,3 sm galyňlykda bolmaly."], ["Dürtüp, gyzgyn ýagda bişirmek", "<circle cx=\"120\" cy=\"75\" r=\"2.5\" fill=\"#8a6a34\"/><circle cx=\"160\" cy=\"70\" r=\"2.5\" fill=\"#8a6a34\"/><circle cx=\"200\" cy=\"80\" r=\"2.5\" fill=\"#8a6a34\"/>", "Dürtülmese gatlakly pökgerýär, gülleýär."]], LW = 320, LH = 150;
(function () {
  var next = 0, tries = 0, N = LS.length;
  function draw() {
    var s = '<rect x="0" y="0" width="' + LW + '" height="' + LH + '" fill="#f6faf4"/>' + LB;
    for (var i = 0; i < next; i++) s += LS[i][1];
    document.getElementById("lsvg").innerHTML = s;
    var h = "";
    for (var k = 0; k < N; k++) {
      if (k < next) continue;
      h += '<button class="btn" data-i="' + k + '">' + LS[k][0] + "</button>";
    }
    document.getElementById("lpool").innerHTML = h;
    var bs = document.getElementById("lpool").getElementsByTagName("button");
    for (var k = 0; k < bs.length; k++) bs[k].onclick = pick;
    document.getElementById("lgoal").textContent = next < N ?
      ((next + 1) + "-nji gatlagy saýla.") : "Nagyş doly boldy!";
    document.getElementById("lsc").textContent = "Gatlak: " + next + " / " + N + " · synanyşyk: " + tries;
  }
  function pick() {
    var i = parseInt(this.getAttribute("data-i"), 10), m = document.getElementById("lmsg");
    tries++;
    if (i === next) {
      next++;
      m.className = "msg ok";
      m.textContent = next === N ? "Tertip dogry!" : ("Dogry! " + LS[next - 1][2]);
    } else {
      m.className = "msg bad";
      m.textContent = "Entek irki: ilki " + LS[next][0] + " gelmeli.";
    }
    draw();
  }
  document.getElementById("lreset").onclick = function () {
    next = 0; tries = 0;
    document.getElementById("lmsg").className = "msg";
    document.getElementById("lmsg").textContent = "";
    draw();
  };
  draw();
})();

var OS = ["Hamyry hamyrmaýa bilen çöregiňki ýaly ýugur.", "Gowy alýança basyryp goý.", "Ýukadyp ýaý.", "Inini üç barmak möçberde kesişdir.", "Her haýsyny gytaklaýyn kes-de, gaýnap duran ýagda bişir."], OO = [2, 4, 0, 3, 1];
(function () {
  var next = 0, tries = 0, N = OS.length;
  function draw() {
    var h = "";
    for (var k = 0; k < OO.length; k++) {
      var i = OO[k];
      if (i < next) continue;
      h += '<button class="btn" data-i="' + i + '">' + OS[i] + "</button>";
    }
    document.getElementById("opool").innerHTML = h;
    var bs = document.getElementById("opool").getElementsByTagName("button");
    for (var k = 0; k < bs.length; k++) bs[k].onclick = pick;
    document.getElementById("ogoal").textContent = next < N ?
      ((next + 1) + "-nji ädimi saýla.") : ("Ähli " + N + " ädim dogry tertipde ýygnaldy!");
    var dv = document.getElementById("odone");
    if (next > 0) {
      var dh = "";
      for (var i = 0; i < next; i++) dh += (i + 1) + ". " + OS[i] + "<br>";
      dv.innerHTML = dh; dv.style.display = "block";
    } else { dv.style.display = "none"; dv.innerHTML = ""; }
    document.getElementById("osc").textContent = "Ädim: " + next + " / " + N + " · synanyşyk: " + tries;
  }
  function pick() {
    var i = parseInt(this.getAttribute("data-i"), 10), m = document.getElementById("omsg");
    tries++;
    if (i === next) {
      next++;
      m.className = "msg ok";
      m.textContent = next === N ? "Tertip dogry!" : "Dogry!";
    } else {
      m.className = "msg bad";
      m.textContent = "Ilki " + (next + 1) + "-nji ädim gelmeli.";
    }
    draw();
  }
  document.getElementById("oreset").onclick = function () {
    next = 0; tries = 0;
    document.getElementById("omsg").className = "msg";
    document.getElementById("omsg").textContent = "";
    draw();
  };
  draw();
})();

var Q = [["Gatlaklynyň ilkinji ýaýylyş galyňlygy näçe?", ["1 mm", "1 sm", "3 sm"], 0], ["Gatlakly dürtülmese näme bolýar?", ["Ýanýar", "Pökgerýär", "Gatýar"], 1], ["Pişmäniň ini näçe möçberde kesilýär?", ["Bir garyş", "Üç barmak", "Bir sere"], 1]];
(function () {
  var qd = 0, qok = 0, h = "";
  for (var i = 0; i < Q.length; i++) {
    h += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
    for (var j = 0; j < Q[i][1].length; j++)
      h += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
    h += '</div><div class="msg" id="qm' + i + '"></div></div>';
  }
  document.getElementById("quiz").innerHTML = h;
  var bs = document.getElementById("quiz").getElementsByTagName("button");
  for (var i = 0; i < bs.length; i++) {
    bs[i].onclick = function () {
      var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
      var m = document.getElementById("qm" + k);
      if (m.getAttribute("data-done")) return;
      m.setAttribute("data-done", "1"); qd++;
      if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
      else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
      document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
    };
  }
})();
</script>
</body>
</html>
