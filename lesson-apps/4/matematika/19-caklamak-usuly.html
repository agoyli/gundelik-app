<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Çaklamak usuly — 4-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .eq { background: #fff6e0; border-radius: 13px; padding: 14px; text-align: center; font-size: 26px; font-weight: 800; }
  .chain { background: #f7fafd; border-radius: 12px; padding: 11px; font-size: 16.5px; line-height: 1.85; text-align: center; }
  .nums { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .nums button { min-height: 46px; font-size: 17px; font-weight: 700; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Çaklamak usuly bilen üçbelgili sana bölmek</h1>
  <div class="sub">Matematika · 4-nji synp</div>

  <div class="card">
    <div class="def">Paýyň bir öýjügindäki sifr <b>9-dan uly bolup bilmeýär</b>. Şonuň üçin çak edilen sifri bölüjä köpeldip barlaýarys: 136 · 8 = 1088.</div>
  </div>

  <div class="card">
    <h3>Paýy tap</h3>
    <div class="eq" id="eq"></div>
    <div class="goal" id="goal" style="margin-top:8px">Dogry paýy saýla.</div>
    <div class="nums" id="nums"></div>
    <div class="msg" id="msg"></div>
    <div class="chain" id="chain" style="margin-top:8px"></div>
    <div class="row">
      <button class="btn primary" id="next">Indiki mysal</button>
      <button class="btn ghost" id="hint">Kömek</button>
    </div>
    <div class="score" id="sc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Matematika 4, II kitap · 84-nji sahypa</div>
</div>

<script>
// [sorag, dogry jogap, düşündiriş]
var T = [["1088 : 136", 8, "136 · 9 = 1224 – uly; 136 · 8 = 1088 – dogry."], ["1141 : 163", 7, "163 · 7 = 1141 – dogry."], ["1464 : 183", 8, "183 · 8 = 1464 – dogry."], ["1026 : 171", 6, "171 · 6 = 1026 – dogry."], ["1096 : 137", 8, "137 · 8 = 1096 – dogry."]];
var VALS = [4, 5, 6, 7, 8, 9];
var ti = 0, d = 0, ok = 0, lock = 0;
function show() {
  document.getElementById("eq").textContent = T[ti][0];
  document.getElementById("msg").className = "msg";
  document.getElementById("msg").textContent = "";
  document.getElementById("chain").textContent = "Jogaby saýlanyňdan soň düşündiriş çykar.";
  lock = 0;
}
var h = "";
for (var i = 0; i < VALS.length; i++) h += '<button class="btn" data-n="' + VALS[i] + '">' + VALS[i] + "</button>";
document.getElementById("nums").innerHTML = h;
var nb = document.getElementById("nums").getElementsByTagName("button");
for (var i = 0; i < nb.length; i++) {
  nb[i].onclick = function () {
    if (lock) return;
    lock = 1; d++;
    var v = this.getAttribute("data-n"), t = T[ti], m = document.getElementById("msg");
    if (v === String(t[1])) { ok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Ýalňyş. Dogry jogap: " + t[1] + "."; }
    document.getElementById("chain").textContent = t[2];
    document.getElementById("sc").textContent = "Netije: " + ok + " / " + d;
  };
}
document.getElementById("next").onclick = function () { ti = (ti + 1) % T.length; show(); };
document.getElementById("hint").onclick = function () {
  var m = document.getElementById("msg");
  m.className = "msg";
  m.textContent = T[ti][2];
};
show();

var Q = [["Paýyň bir öýjügindäki sifr näçeden uly bolup bilmeýär?", ["9", "10", "8"], 0], ["1088 : 136 näçe bolar?", ["8", "9", "10"], 0], ["Çak edilen sifr nähili barlanýar?", ["Bölüjä köpeldip", "Bölünijä goşup", "Paýa bölüp"], 0]];
var qd = 0, qok = 0, hh = "";
for (var i = 0; i < Q.length; i++) {
  hh += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
  for (var j = 0; j < Q[i][1].length; j++) hh += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
  hh += '</div><div class="msg" id="qm' + i + '"></div></div>';
}
document.getElementById("quiz").innerHTML = hh;
var qb = document.getElementById("quiz").getElementsByTagName("button");
for (var i = 0; i < qb.length; i++) {
  qb[i].onclick = function () {
    var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
    var m = document.getElementById("qm" + k);
    if (m.getAttribute("data-done")) return;
    m.setAttribute("data-done", "1"); qd++;
    if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
    document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
  };
}
</script>
</body>
</html>
