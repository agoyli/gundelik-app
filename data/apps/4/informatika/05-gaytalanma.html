<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaýtalanma algoritmleri — 4-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .stage { background: #eef2f8; border-radius: 14px; padding: 10px; }
  .stage svg { display: block; margin: 0 auto; background: #fff; border-radius: 11px;
               max-width: 100%; height: auto; }
  .prog { background: #f7fafd; border-radius: 13px; padding: 11px;
          font-family: ui-monospace, Menlo, monospace; font-size: 13.5px; line-height: 1.95; }
  .prog b { color: #2456b0; }
  .prog .in { padding-left: 20px; }
  .prog .in2 { padding-left: 40px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .calc { background: #f2edfd; border-radius: 13px; padding: 11px; font-size: 14px;
          line-height: 1.8; font-family: ui-monospace, Menlo, monospace; }
  .calc b { color: #6a4bb8; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px;
        font-size: 15px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Gaýtalanma algoritmleri</h1>
  <div class="sub">Informatika · 4-nji synp</div>

  <div class="card">
    <div class="tabs" id="tb"></div>
    <div class="prog" id="pg" style="margin-top:9px"></div>
    <div class="slider" style="margin-top:9px"><span class="lbl">Daşky gaýtalanma</span>
      <input type="range" id="a" min="1" max="6" value="3"><span class="out" id="ao"></span></div>
    <div class="slider" id="brow"><span class="lbl">Içki gaýtalanma</span>
      <input type="range" id="b" min="1" max="6" value="4"><span class="out" id="bo"></span></div>
    <div class="calc" id="calc"></div>
    <div class="row" style="margin-top:9px">
      <button class="btn primary" id="run">▶️ Işlet</button>
      <button class="btn ghost" id="clr">🧹 Arassala</button>
    </div>
    <div class="stage" id="cv" style="margin-top:9px"></div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="q"></div>
    <div class="score" id="sc"></div>
  </div>

  <div class="footer">Informatikanyň esaslary · 4-nji synp</div>
</div>

<script>
const $ = id => document.getElementById(id);
let mode = "param";

const MODES = {
  param: "🔁 ÜÇIN … ÝERINE ÝETIRMELI",
  sert:  "❓ HÄZIRLIKÇE … ÝERINE ÝETIRMELI",
};
function tabs() {
  $("tb").innerHTML = Object.entries(MODES).map(([k, v]) =>
    `<button class="btn ${k === mode ? "sel" : ""}" data-k="${k}">${v}</button>`).join("");
  $("tb").querySelectorAll("button").forEach(x => x.onclick = () => {
    mode = x.dataset.k; path = []; drawPath(); prog();
  });
}
function prog() {
  const a = +$("a").value, b = +$("b").value;
  $("ao").textContent = a; $("bo").textContent = b;
  $("brow").style.display = mode === "param" ? "" : "none";
  if (mode === "param") {
    $("pg").innerHTML =
      `<div><b>Başlangyjy</b></div>` +
      `<div><b>N ÜÇIN</b> 1-den <b>${a}</b>-a çenli <b>Ýerine ýetirmeli</b></div>` +
      `<div class="in"><b>Başlangyjy</b></div>` +
      `<div class="in"><b>M ÜÇIN</b> 1-den <b>${b}</b>-a çenli <b>Ýerine ýetirmeli</b></div>` +
      `<div class="in2">öňe 1 ädim;</div>` +
      `<div class="in">saga öwrül;</div>` +
      `<div class="in"><b>Soňy</b>;</div>` +
      `<div><b>Soňy.</b></div>` +
      `<div style="color:#5b6b80;margin-top:6px">// iňlisçe: For N = 1 to ${a} Do ` +
      `Begin For M = 1 to ${b} Do … End;</div>`;
    $("calc").innerHTML =
      `daşky parametr N: 1-den <b>${a}</b>-a çenli<br>` +
      `içki parametr M: 1-den <b>${b}</b>-a çenli<br>` +
      `«öňe» buýrugy: ${a} · ${b} = <b>${a * b}</b> gezek<br>` +
      `«saga öwrül» buýrugy: <b>${a}</b> gezek<br>` +
      `jemi ädim: <b>${a * b + a}</b><br>` +
      `<span style="color:#5b6b80">Başlangyjy we Soňy sözleriniň arasyndaky bölek – ` +
      `iç-içine ýerleşen algoritm.</span>`;
  } else {
    $("pg").innerHTML =
      `<div><b>Başlangyjy</b></div>` +
      `<div><b>Häzirlikçe</b> diwara ýetmedik <b>Ýerine ýetirmeli</b></div>` +
      `<div class="in">öňe 1 ädim;</div>` +
      `<div><b>Soňy.</b></div>` +
      `<div style="color:#5b6b80;margin-top:6px">// iňlisçe: While … Do</div>`;
    $("calc").innerHTML =
      `şert: <b>diwara ýetmedik bolsa</b><br>` +
      `şert ilki barlanýar, soňra hereket edilýär<br>` +
      `şert berjaý edilmese gaýtalanma <b>tamamlanýar</b><br>` +
      `gaýtalanmanyň sany <b>öňünden belli däl</b><br>` +
      `bu ýerde diwara çenli <b>7</b> öýjük bar`;
  }
}
let path = [];
function drawPath() {
  const pts = path.map(p => `${p[0]},${p[1]}`).join(" ");
  $("cv").innerHTML = `<svg viewBox="0 0 300 200" width="300"
    xmlns="http://www.w3.org/2000/svg">
    ${mode === "sert" ? `<rect x="262" y="30" width="14" height="140" fill="#5b6b80"/>
      <text x="269" y="186" text-anchor="middle" font-size="11"
        font-family="system-ui" fill="#5b6b80">diwar</text>` : ""}
    ${path.length > 1 ? `<polyline points="${pts}" fill="none" stroke="#2456b0"
      stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
    ${path.length ? `<circle cx="${path[path.length - 1][0]}" cy="${path[path.length - 1][1]}"
      r="6" fill="#e5007d"/>` : ""}
  </svg>`;
}
$("run").onclick = () => {
  const a = +$("a").value, b = +$("b").value;
  path = [];
  if (mode === "param") {
    let x = 90, y = 150, dir = -90;
    path = [[x, y]];
    const L = 16;
    const seq = [];
    for (let i = 0; i < a; i++) {
      for (let j = 0; j < b; j++) seq.push("f");
      seq.push("r");
    }
    let k = 0;
    const t = setInterval(() => {
      const c = seq[k++];
      if (c === "f") {
        x += L * Math.cos(dir * Math.PI / 180);
        y += L * Math.sin(dir * Math.PI / 180);
        path.push([Math.round(x), Math.round(y)]);
      } else dir += Math.round(360 / a);
      drawPath();
      if (k >= seq.length) {
        clearInterval(t);
        $("msg").textContent =
          `🎉 «öňe» ${a * b} gezek, «saga öwrül» ${a} gezek – jemi ${a * b + a} ädim.`;
        $("msg").className = "msg ok";
      }
    }, 90);
  } else {
    let x = 40, y = 100;
    path = [[x, y]];
    let n = 0;
    const t = setInterval(() => {
      x += 32; n++;
      path.push([x, y]);
      drawPath();
      if (x >= 258) {
        clearInterval(t);
        $("msg").textContent =
          `🎉 Diwara ýetildi. Şert ${n} ädimden soň bozuldy we gaýtalanma togtady.`;
        $("msg").className = "msg ok";
      }
    }, 220);
  }
};
$("clr").onclick = () => { path = []; drawPath(); $("msg").textContent = ""; };
["a", "b"].forEach(k => $(k).addEventListener("input", () => { prog(); path = []; drawPath(); }));

/* ---------------- test ---------------- */
const Q = [
  ["Parametrli gaýtalanmada näme öňünden bellidir?",
   ["Gaýtalanmalaryň sany", "Suratyň reňki", "Faýlyň ady"], 0],
  ["«3 gezek gaýtala: 4 gezek öňe» näçe ädim edýär?", ["7", "12", "3"], 1],
  ["Şertli gaýtalanma haçan togtaýar?",
   ["Hiç haçan", "Bir ädimden soň", "Şert bozulanda"], 2],
];
let d = 0, r = 0;
$("q").innerHTML = Q.map((q, i) =>
  `<div class="qa"><b>${i + 1}. ${q[0]}</b><div class="row tight" style="margin-top:6px">` +
  q[1].map((o, j) => `<button class="btn" data-i="${i}" data-j="${j}">${o}</button>`).join("") +
  `</div><div class="expl" id="e${i}"></div></div>`).join("");
$("q").querySelectorAll("button").forEach(b => b.onclick = () => {
  const i = +b.dataset.i;
  if ($("e" + i).textContent) return;
  const good = +b.dataset.j === Q[i][2];
  b.classList.add("sel");
  $("e" + i).textContent = good ? "✅ Dogry!" : `❌ Dogry jogap: ${Q[i][1][Q[i][2]]}.`;
  d++; if (good) r++;
  $("sc").textContent = `${r} / ${d}` + (d === Q.length ? " – tamam 🎉" : "");
});

tabs(); prog(); drawPath();
</script>
</body>
</html>
