<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gysga ýazgy boýunça mesele düzmek — 1-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .short { background: #f7fafd; border-radius: 12px; padding: 11px; font-size: 16.5px; line-height: 1.9; }
  .plan { background: #eef3fb; border-radius: 12px; padding: 11px; font-size: 16px; line-height: 1.7; min-height: 50px; }
  .eq { text-align: center; font-size: 26px; font-weight: 700; margin: 8px 0 4px; }
  .nums { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .nums button { min-height: 46px; font-size: 17px; font-weight: 700; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Gysga ýazgy boýunça mesele düzmek</h1>
  <div class="sub">Matematika · 1-nji synp</div>

  <div class="card">
    <div class="def"><b>Meseläni çözmegiň meýilnamasy:</b> 1. Näbellini tapmak.
      2. Meseläniň soragyna jogap bermek.<br>
      <b>7 + 4 – aňlatma. 11 – aňlatmanyň bahasy.</b></div>
  </div>

  <div class="card">
    <h3>Gysga ýazgy boýunça mesele düz</h3>
    <div class="short" id="short"></div>
    <div class="plan" id="plan" style="margin-top:8px"></div>
    <div class="row">
      <button class="btn primary" id="p1">1-nji ädim</button>
      <button class="btn" id="p2">2-nji ädim</button>
      <button class="btn ghost" id="new">Başga ýazgy</button>
    </div>
    <div class="msg" id="pmsg"></div>
  </div>

  <div class="card">
    <h3>Aňlatmanyň bahasyny tap</h3>
    <div class="eq" id="task"></div>
    <div class="nums" id="nums"></div>
    <div class="msg" id="tmsg"></div>
    <div class="row"><button class="btn primary" id="next">Indiki aňlatma</button></div>
    <div class="score" id="tsc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Matematika 1, II kitap · 95–104-nji sahypalar</div>
</div>

<script>
var S = [
  { u: "kitap", a: 7, dif: 4, more: 1, txt: "Birinji tekjede 7 kitap, ikinjide ondan 4 kitap köp." },
  { u: "guş", a: 6, dif: 2, more: 1, txt: "Bir şahada 6 guş, beýlekisinde ondan 2 guş köp." },
  { u: "alma", a: 9, dif: 3, more: 0, txt: "Birinji sebetde 9 alma, ikinjide ondan 3 alma az." },
  { u: "surat", a: 5, dif: 5, more: 1, txt: "Aman 5 surat, Merjen ondan 5 surat köp çekdi." }
];
var si = 0, stage = 0;
function sec() { var s = S[si]; return s.more ? s.a + s.dif : s.a - s.dif; }
function show() {
  var s = S[si];
  document.getElementById("short").innerHTML =
    "<b>I</b> — " + s.a + " " + s.u + "<br><b>II</b> — ?, ondan " + s.dif + " " + s.u + " " +
    (s.more ? "köp" : "az") + "<br><b>Jemi</b> — ? " + s.u;
  var p = document.getElementById("plan");
  if (stage === 0) p.innerHTML = "Bu ýazgy boýunça mesele düzmek bolýar:<br>«" + s.txt + " Jemi näçe " + s.u + " bar?»";
  else if (stage === 1) p.innerHTML = "<b>1) " + s.a + " " + (s.more ? "+" : "−") + " " + s.dif + " = " + sec() + "</b> – näbelli tapyldy.";
  else p.innerHTML = "<b>1) " + s.a + " " + (s.more ? "+" : "−") + " " + s.dif + " = " + sec() + "</b><br><b>2) " +
    s.a + " + " + sec() + " = " + (s.a + sec()) + "</b><br>Jogap: " + (s.a + sec()) + " " + s.u + ".";
}
document.getElementById("p1").onclick = function () {
  stage = 1; show();
  var m = document.getElementById("pmsg");
  m.className = "msg ok"; m.textContent = "1-nji ädim – näbellini tapmak.";
};
document.getElementById("p2").onclick = function () {
  var m = document.getElementById("pmsg");
  if (stage === 0) { m.className = "msg bad"; m.textContent = "Ilki 1-nji ädimi ýerine ýetir."; return; }
  stage = 2; show();
  m.className = "msg ok"; m.textContent = "2-nji ädim – soraga jogap bermek.";
};
document.getElementById("new").onclick = function () {
  si = (si + 1) % S.length; stage = 0; show();
  document.getElementById("pmsg").className = "msg";
  document.getElementById("pmsg").textContent = "";
};
show();

var T = [[8, "+", 5], [12, "−", 5], [7, "+", 4], [15, "−", 6], [9, "+", 8], [14, "−", 7]];
var ti = 0, d = 0, ok = 0, lock = 0;
function val() { var t = T[ti]; return t[1] === "+" ? t[0] + t[2] : t[0] - t[2]; }
function showT() {
  var t = T[ti];
  document.getElementById("task").textContent = t[0] + " " + t[1] + " " + t[2] + " aňlatmasynyň bahasy näçe?";
  document.getElementById("tmsg").className = "msg";
  document.getElementById("tmsg").textContent = "";
  lock = 0;
}
var h = "";
for (var i = 5; i <= 18; i++) h += '<button class="btn" data-n="' + i + '">' + i + "</button>";
document.getElementById("nums").innerHTML = h;
var nb = document.getElementById("nums").getElementsByTagName("button");
for (var i = 0; i < nb.length; i++) {
  nb[i].onclick = function () {
    if (lock) return;
    lock = 1; d++;
    var v = parseInt(this.getAttribute("data-n"), 10), r = val(), m = document.getElementById("tmsg");
    if (v === r) { ok++; m.className = "msg ok"; m.textContent = "Dogry! Aňlatmanyň bahasy – " + r + "."; }
    else { m.className = "msg bad"; m.textContent = "Ýalňyş. Aňlatmanyň bahasy – " + r + "."; }
    document.getElementById("tsc").textContent = "Netije: " + ok + " / " + d;
  };
}
document.getElementById("next").onclick = function () { ti = (ti + 1) % T.length; showT(); };
showT();

var Q = [
  ["8 + 5 aňlatmasynyň bahasy näçe?", ["13", "12", "14"], 0],
  ["Meseläni çözmegiň meýilnamasynyň 1-nji ädimi näme?", ["Näbellini tapmak", "Jogaby ýazmak", "Barlamak"], 0],
  ["«Aňlatma» diýip nämä aýdylýar?", ["Sanlaryň amal belgisi bilen ýazgysyna", "Diňe jogaba", "Meseläniň soragyna"], 0],
  ["12 − 5 aňlatmasynyň bahasy näçe?", ["7", "6", "8"], 0]
];
var qd = 0, qok = 0, hh = "";
for (var i = 0; i < Q.length; i++) {
  hh += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
  for (var j = 0; j < Q[i][1].length; j++) hh += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
  hh += '</div><div class="msg" id="qm' + i + '"></div></div>';
}
document.getElementById("quiz").innerHTML = hh;
var qb = document.getElementById("quiz").getElementsByTagName("button");
for (var i = 0; i < qb.length; i++) {
  qb[i].onclick = function () {
    var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
    var m = document.getElementById("qm" + k);
    if (m.getAttribute("data-done")) return;
    m.setAttribute("data-done", "1"); qd++;
    if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
    document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
  };
}
</script>
</body>
</html>
