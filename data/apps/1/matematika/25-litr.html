<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Litr — 1-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .jar { background: #f7fafd; border-radius: 13px; padding: 10px; }
  svg { display: block; width: 100%; height: auto; }
  .nums { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .nums button { min-height: 46px; font-size: 17px; font-weight: 700; }
  .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .pick button { min-height: 54px; font-size: 14.5px; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Litr</h1>
  <div class="sub">Matematika · 1-nji synp</div>

  <div class="card">
    <div class="def">Süýt, ýag we beýleki <b>suwuklyklar litr</b> bilen ölçelýär.
      Litr gysgaça <b>«l»</b> görnüşinde ýazylýar.</div>
  </div>

  <div class="card">
    <h3>Bedräni doldur</h3>
    <div class="jar"><svg id="sv" viewBox="0 0 220 150"></svg></div>
    <div class="row">
      <button class="btn primary" id="pour">1 l guý</button>
      <button class="btn" id="take">1 l al</button>
      <button class="btn ghost" id="rs">Boşat</button>
    </div>
    <div class="msg" id="jmsg"></div>
  </div>

  <div class="card">
    <h3>Litr bilenmi ýa kilogram bilen?</h3>
    <div class="goal" id="gq"></div>
    <div class="pick">
      <button class="btn" id="pl">Litr (l)</button>
      <button class="btn" id="pk">Kilogram (kg)</button>
    </div>
    <div class="msg" id="pmsg"></div>
    <div class="row"><button class="btn ghost" id="pnext">Indiki haryt</button></div>
    <div class="score" id="psc"></div>
  </div>

  <div class="card">
    <h3>Meseläni çöz</h3>
    <div class="goal" id="task"></div>
    <div class="nums" id="nums"></div>
    <div class="msg" id="tmsg"></div>
    <div class="row"><button class="btn ghost" id="tnext">Başga mesele</button></div>
    <div class="score" id="tsc"></div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Matematika 1, II kitap · 65-nji sahypa</div>
</div>

<script>
var lit = 0, MAXL = 5;
function draw() {
  var s = '<rect x="60" y="20" width="100" height="110" rx="8" fill="#e8eef7" stroke="#9db1c8" stroke-width="2"/>';
  for (var i = 1; i < MAXL; i++) {
    var y = 130 - i * 22;
    s += '<line x1="60" y1="' + y + '" x2="80" y2="' + y + '" stroke="#9db1c8" stroke-width="1.5"/>';
    s += '<text x="52" y="' + (y + 4) + '" font-size="10" text-anchor="end" fill="#5a6a7a">' + i + " l</text>";
  }
  var hgt = lit * 22;
  if (hgt > 0) s += '<rect x="62" y="' + (130 - hgt) + '" width="96" height="' + hgt + '" rx="4" fill="#8fc3ea"/>';
  s += '<text x="110" y="145" font-size="12" text-anchor="middle" fill="#4a5a6a">Bedrede ' + lit + " l suw bar</text>";
  document.getElementById("sv").innerHTML = s;
  var m = document.getElementById("jmsg");
  m.className = "msg" + (lit === MAXL ? " ok" : "");
  m.textContent = lit === MAXL ? "Bedre doldy: " + MAXL + " l." : "Bedrede " + lit + " l suw bar.";
}
document.getElementById("pour").onclick = function () { if (lit < MAXL) lit++; draw(); };
document.getElementById("take").onclick = function () { if (lit > 0) lit--; draw(); };
document.getElementById("rs").onclick = function () { lit = 0; draw(); };
draw();

var G = [["Süýt", "🥛", 1], ["Un", "🌾", 0], ["Ösümlik ýagy", "🫒", 1], ["Kartoşka", "🥔", 0], ["Suw", "💧", 1]];
var gi = 0, pd = 0, pok = 0, plock = 0;
function showG() {
  document.getElementById("gq").innerHTML = G[gi][1] + " <b>" + G[gi][0] + "</b> näme bilen ölçelýär?";
  document.getElementById("pmsg").className = "msg";
  document.getElementById("pmsg").textContent = "";
  plock = 0;
}
function pans(isL) {
  if (plock) return;
  plock = 1; pd++;
  var right = (G[gi][2] === 1) === isL, m = document.getElementById("pmsg");
  if (right) { pok++; m.className = "msg ok"; m.textContent = "Dogry! " + G[gi][0] + " – " + (G[gi][2] ? "litr" : "kilogram") + " bilen."; }
  else { m.className = "msg bad"; m.textContent = "Ýalňyş. " + G[gi][0] + " " + (G[gi][2] ? "litr" : "kilogram") + " bilen ölçelýär."; }
  document.getElementById("psc").textContent = "Netije: " + pok + " / " + pd;
}
document.getElementById("pl").onclick = function () { pans(true); };
document.getElementById("pk").onclick = function () { pans(false); };
document.getElementById("pnext").onclick = function () { gi = (gi + 1) % G.length; showG(); };
showG();

var T = [[4, 1, "−"], [3, 2, "+"], [5, 2, "−"], [2, 6, "+"]], ti = 0, d = 0, ok = 0, lock = 0;
function showT() {
  var t = T[ti];
  document.getElementById("task").textContent = t[2] === "+" ?
    ("Bankada " + t[0] + " l süýt bardy, ýene " + t[1] + " l guýuldy. Jemi näçe litr boldy?") :
    ("Bedrede " + t[0] + " l suw bardy, " + t[1] + " l alyndy. Näçe litr galdy?");
  document.getElementById("tmsg").className = "msg";
  document.getElementById("tmsg").textContent = "";
  lock = 0;
}
var h = "";
for (var i = 1; i <= 10; i++) h += '<button class="btn" data-n="' + i + '">' + i + "</button>";
document.getElementById("nums").innerHTML = h;
var nb = document.getElementById("nums").getElementsByTagName("button");
for (var i = 0; i < nb.length; i++) {
  nb[i].onclick = function () {
    if (lock) return;
    lock = 1; d++;
    var v = parseInt(this.getAttribute("data-n"), 10), t = T[ti];
    var r = t[2] === "+" ? t[0] + t[1] : t[0] - t[1], m = document.getElementById("tmsg");
    if (v === r) { ok++; m.className = "msg ok"; m.textContent = "Dogry! " + t[0] + " " + t[2] + " " + t[1] + " = " + r + " l."; }
    else { m.className = "msg bad"; m.textContent = "Ýalňyş. Dogry jogap: " + r + " l."; }
    document.getElementById("tsc").textContent = "Netije: " + ok + " / " + d;
  };
}
document.getElementById("tnext").onclick = function () { ti = (ti + 1) % T.length; showT(); };
showT();

var Q = [
  ["Suwuklyklar haýsy birlik bilen ölçelýär?", ["Litr", "Kilogram", "Santimetr"], 0],
  ["Litr nähili gysgaldylyp ýazylýar?", ["l", "kg", "sm"], 0],
  ["Bankada 3 l süýt bardy, ýene 2 l guýuldy. Jemi näçe boldy?", ["5 l", "1 l", "6 l"], 0]
];
var qd = 0, qok = 0, hh = "";
for (var i = 0; i < Q.length; i++) {
  hh += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
  for (var j = 0; j < Q[i][1].length; j++) hh += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
  hh += '</div><div class="msg" id="qm' + i + '"></div></div>';
}
document.getElementById("quiz").innerHTML = hh;
var qb = document.getElementById("quiz").getElementsByTagName("button");
for (var i = 0; i < qb.length; i++) {
  qb[i].onclick = function () {
    var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
    var m = document.getElementById("qm" + k);
    if (m.getAttribute("data-done")) return;
    m.setAttribute("data-done", "1"); qd++;
    if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
    else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
    document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
  };
}
</script>
</body>
</html>
