<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Деепричастный оборот — 8 класс</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .stage { background: #f6faf4; border-radius: 13px; padding: 6px; }
  .stage svg { display: block; width: 100%; height: auto; }
  .info { background: #fdfaf2; border-radius: 12px; padding: 11px 13px; font-size: 16px; line-height: 1.7; min-height: 62px; }
  .pool { display: grid; gap: 7px; }
  .pool button { min-height: 48px; font-size: 15px; font-weight: 700; text-align: left; padding: 8px 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { min-height: 44px; font-size: 15px; font-weight: 700; padding: 6px 12px; }
  .lines { display: grid; gap: 6px; }
  .lines button { min-height: 46px; font-size: 15.5px; font-weight: 600; text-align: left; padding: 8px 12px; }
  .r0 { background: #dbeafe !important; }
  .r1 { background: #dcfce7 !important; }
  .r2 { background: #fee2e2 !important; }
  .done { background: #dff2e3; border-radius: 12px; padding: 10px 12px; font-size: 15.5px; line-height: 1.7; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
  .flow { stroke-dasharray: 7 6; }
  .flow-up { animation: mv 1.5s linear infinite; }
  .flow-dn { animation: mv 1.5s linear infinite reverse; }
  @keyframes mv { to { stroke-dashoffset: -26; } }
  .tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
  .tbl th, .tbl td { border: 1px solid #cfe0bd; padding: 9px 7px; text-align: left; line-height: 1.45; }
  .tbl th { background: #eaf3e4; font-weight: 700; }
  .tbl td { cursor: pointer; }
  .tbl td.sel { background: #cdebd6; }
  .tbl-wrap { overflow-x: auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Деепричастие и оборот</h1>
  <div class="sub">Русский язык · 8 класс</div>

  <div class="card">
    <div class="def">Запятые ставятся почти всегда — кроме одного случая.</div>
  </div>

  <div class="card">
    <h3>Что такое деепричастие</h3>
    <div class="goal">Нажми на часть схемы.</div>
    <div class="stage"><svg id="shsvg" viewBox="0 0 320 200"></svg></div>
    <div class="info" id="shinfo">Нажми на часть рисунка.</div>
  </div>

  <div class="card">
    <h3>Порядок проверки</h3>
    <div class="goal" id="ogoal"></div>
    <div class="pool" id="opool"></div>
    <div class="msg" id="omsg"></div>
    <div class="done" id="odone" style="display:none"></div>
    <div class="row"><button class="btn ghost" id="oreset">Начать заново</button></div>
    <div class="score" id="osc"></div>
  </div>

  <div class="card">
    <h3>Проверь себя</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Русский язык 8 (Л. Сатулина, М. Халназаров), Ашхабад 2020 — по учебнику.</div>
</div>
<script>

var SP = [["Глагол", "M20 24 H150 V68 H20 Z", 85, 51, "От глагола деепричастие берёт значение действия."], ["Наречие", "M170 24 H300 V68 H170 Z", 235, 51, "От наречия деепричастие берёт неизменяемость и роль обстоятельства."], ["Деепричастие", "M20 86 H300 V126 H20 Z", 160, 111, "Вопросы: что делая? что сделав? как? почему? когда?"], ["Оборот", "M20 144 H150 V184 H20 Z", 85, 169, "Деепричастие с зависимыми словами: «ожидая победу»."], ["Фразеологизм", "M170 144 H300 V184 H170 Z", 235, 169, "«Затаив дыхание», «спустя рукава» — запятыми не выделяются."]], SW = 320, SH = 200;
(function () {
  function draw(sel) {
    var s = '<rect x="0" y="0" width="' + SW + '" height="' + SH + '" fill="#f6faf4"/>';
    for (var i = 0; i < SP.length; i++) {
      var on = (i === sel);
      s += '<g data-i="' + i + '" style="cursor:pointer">';
      s += '<path d="' + SP[i][1] + '" fill="' + (on ? "#cdebd6" : "#eaf3e4") +
           '" stroke="' + (on ? "#1d6f3c" : "#7a9468") + '" stroke-width="' + (on ? 3 : 2) + '"/>';
      s += '<text x="' + SP[i][2] + '" y="' + SP[i][3] + '" font-size="10.5" fill="#23381a" ' +
           'text-anchor="middle">' + SP[i][0] + '</text></g>';
    }
    document.getElementById("shsvg").innerHTML = s;
    var gs = document.getElementById("shsvg").getElementsByTagName("g");
    for (var k = 0; k < gs.length; k++) {
      gs[k].onclick = function () {
        var i = parseInt(this.getAttribute("data-i"), 10);
        draw(i);
        document.getElementById("shinfo").innerHTML = "<b>" + SP[i][0] + "</b> — " + SP[i][4];
      };
    }
  }
  draw(-1);
})();

var OS = ["Найти слово, отвечающее на вопрос «что делая?»", "Проверить связь с глаголом-сказуемым", "Найти зависимые слова", "Обозначить границы оборота", "Проверить, не фразеологизм ли это", "Поставить запятые"], OO = [4, 1, 5, 0, 3, 2];
(function () {
  var next = 0, tries = 0, N = OS.length;
  function draw() {
    var h = "";
    for (var k = 0; k < OO.length; k++) {
      var i = OO[k];
      if (i < next) continue;
      h += '<button class="btn" data-i="' + i + '">' + OS[i] + "</button>";
    }
    document.getElementById("opool").innerHTML = h;
    var bs = document.getElementById("opool").getElementsByTagName("button");
    for (var k = 0; k < bs.length; k++) bs[k].onclick = pick;
    document.getElementById("ogoal").textContent = next < N ?
      ((next + 1) + " шаг — выбери.") : ("Все " + N + " шагов расставлены верно!");
    var dv = document.getElementById("odone");
    if (next > 0) {
      var dh = "";
      for (var i = 0; i < next; i++) dh += (i + 1) + ". " + OS[i] + "<br>";
      dv.innerHTML = dh; dv.style.display = "block";
    } else { dv.style.display = "none"; dv.innerHTML = ""; }
    document.getElementById("osc").textContent = "Шаг: " + next + " / " + N + " · попыток: " + tries;
  }
  function pick() {
    var i = parseInt(this.getAttribute("data-i"), 10), m = document.getElementById("omsg");
    tries++;
    if (i === next) {
      next++;
      m.className = "msg ok";
      m.textContent = next === N ? "Порядок верный!" : "Правильно!";
    } else {
      m.className = "msg bad";
      m.textContent = "Сначала должен идти шаг № " + (next + 1) + ".";
    }
    draw();
  }
  document.getElementById("oreset").onclick = function () {
    next = 0; tries = 0;
    document.getElementById("omsg").className = "msg";
    document.getElementById("omsg").textContent = "";
    draw();
  };
  draw();
})();

var Q = [["Признаки каких частей речи соединяет деепричастие?", ["Глагола и наречия", "Глагола и прилагательного", "Наречия и существительного"], 0], ["Каким членом предложения является деепричастие?", ["Обстоятельством", "Подлежащим", "Определением"], 0], ["Когда деепричастный оборот не выделяется запятыми?", ["Если он часть фразеологизма", "Если он в начале предложения", "Он всегда выделяется"], 0]];
(function () {
  var qd = 0, qok = 0, h = "";
  for (var i = 0; i < Q.length; i++) {
    h += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
    for (var j = 0; j < Q[i][1].length; j++)
      h += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
    h += '</div><div class="msg" id="qm' + i + '"></div></div>';
  }
  document.getElementById("quiz").innerHTML = h;
  var bs = document.getElementById("quiz").getElementsByTagName("button");
  for (var i = 0; i < bs.length; i++) {
    bs[i].onclick = function () {
      var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
      var m = document.getElementById("qm" + k);
      if (m.getAttribute("data-done")) return;
      m.setAttribute("data-done", "1"); qd++;
      if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Правильно!"; }
      else { m.className = "msg bad"; m.textContent = "Правильный ответ: " + Q[k][1][Q[k][2]]; }
      document.getElementById("qsc").textContent = "Результат: " + qok + " / " + qd;
    };
  }
})();
</script>
</body>
</html>
