<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oba hojalyk meýdanlary — 8-nji synp</title>
<link rel="stylesheet" href="../../lesson.css">
<style>
  .def { background: #e3edfd; border-radius: 14px; padding: 12px 14px; font-size: 16.5px; line-height: 1.6; }
  .stage { background: #f6faf4; border-radius: 13px; padding: 6px; }
  .stage svg { display: block; width: 100%; height: auto; }
  .info { background: #fdfaf2; border-radius: 12px; padding: 11px 13px; font-size: 16px; line-height: 1.7; min-height: 62px; }
  .pool { display: grid; gap: 7px; }
  .pool button { min-height: 48px; font-size: 15px; font-weight: 700; text-align: left; padding: 8px 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { min-height: 44px; font-size: 15px; font-weight: 700; padding: 6px 12px; }
  .lines { display: grid; gap: 6px; }
  .lines button { min-height: 46px; font-size: 15.5px; font-weight: 600; text-align: left; padding: 8px 12px; }
  .r0 { background: #dbeafe !important; }
  .r1 { background: #dcfce7 !important; }
  .r2 { background: #fee2e2 !important; }
  .done { background: #dff2e3; border-radius: 12px; padding: 10px 12px; font-size: 15.5px; line-height: 1.7; }
  .qa { background: #f7fafd; border-radius: 13px; padding: 11px; margin-bottom: 6px; font-size: 16px; line-height: 1.6; }
  .flow { stroke-dasharray: 7 6; }
  .flow-up { animation: mv 1.5s linear infinite; }
  .flow-dn { animation: mv 1.5s linear infinite reverse; }
  @keyframes mv { to { stroke-dashoffset: -26; } }
  .tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
  .tbl th, .tbl td { border: 1px solid #cfe0bd; padding: 9px 7px; text-align: left; line-height: 1.45; }
  .tbl th { background: #eaf3e4; font-weight: 700; }
  .tbl td { cursor: pointer; }
  .tbl td.sel { background: #cdebd6; }
  .tbl-wrap { overflow-x: auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Oba hojalyk meýdanlaryny hasaplamak</h1>
  <div class="sub">Geometriýa · 8-nji synp</div>

  <div class="card">
    <div class="def">Meýdany böleklere böl, her bölegi hasapla, jemle.</div>
  </div>

  <div class="card">
    <h3>Meýdany böleklere böl</h3>
    <div class="goal" id="lgoal"></div>
    <div class="stage"><svg id="lsvg" viewBox="0 0 320 180"></svg></div>
    <div class="pool" id="lpool"></div>
    <div class="msg" id="lmsg"></div>
    <div class="row"><button class="btn ghost" id="lreset">Täzeden başla</button></div>
    <div class="score" id="lsc"></div>
  </div>

  <div class="card">
    <h3>Gektara öwür</h3>
    <div class="goal">Ýeriň uzynlygyny süýşürgiç bilen üýtget.</div>
    <div class="row"><span class="mono" id="clab"></span></div>
    <input class="slider" id="cinp" type="range" min="50" max="400" step="50" value="200">
    <div class="info" id="cout"></div>
    <div class="note">1 ga = 10 000 m². Hasyl meýdana köpeldilip tapylýar.</div>
  </div>

  <div class="card">
    <h3>Barla</h3>
    <div id="quiz"></div>
    <div class="score" id="qsc"></div>
  </div>
  <div class="footer">Geometriýa 8, Aşgabat — kitaba görä.</div>
</div>
<script>

var LB = "<path d=\"M20 150 L300 150 L300 70 L180 30 L20 70 Z\" fill=\"none\" stroke=\"#5b6b80\" stroke-width=\"3\" stroke-dasharray=\"6 5\"/>", LS = [["Gönüburçluk bölegi", "<path d=\"M20 150 L180 150 L180 70 L20 70 Z\" fill=\"#cfe0fb\" stroke=\"#2456b0\" stroke-width=\"2\"/><text x=\"76\" y=\"115\" font-size=\"13\" fill=\"#1e2a3a\">160 × 80</text>", "Ilki iň uly gönüburçlugy bölüp al: S = a · b."], ["Trapesiýa bölegi", "<path d=\"M180 150 L300 150 L300 70 L180 70 Z\" fill=\"#e0f5e6\" stroke=\"#1d7a3d\" stroke-width=\"2\"/><text x=\"212\" y=\"115\" font-size=\"13\" fill=\"#1e2a3a\">120 × 80</text>", "Ikinji gönüburçlugy hasapla we öňkä goş."], ["Üçburçluk bölegi", "<path d=\"M20 70 L180 30 L180 70 Z\" fill=\"#fdeee0\" stroke=\"#b25b12\" stroke-width=\"2\"/><text x=\"70\" y=\"62\" font-size=\"12\" fill=\"#1e2a3a\">S = 0,5·a·h</text>", "Galan üçburçlugyň meýdanyny goş: 0,5 · esas · beýiklik."]], LW = 320, LH = 180;
(function () {
  var next = 0, tries = 0, N = LS.length;
  function draw() {
    var s = '<rect x="0" y="0" width="' + LW + '" height="' + LH + '" fill="#f6faf4"/>' + LB;
    for (var i = 0; i < next; i++) s += LS[i][1];
    document.getElementById("lsvg").innerHTML = s;
    var h = "";
    for (var k = 0; k < N; k++) {
      if (k < next) continue;
      h += '<button class="btn" data-i="' + k + '">' + LS[k][0] + "</button>";
    }
    document.getElementById("lpool").innerHTML = h;
    var bs = document.getElementById("lpool").getElementsByTagName("button");
    for (var k = 0; k < bs.length; k++) bs[k].onclick = pick;
    document.getElementById("lgoal").textContent = next < N ?
      ((next + 1) + "-nji gatlagy saýla.") : "Nagyş doly boldy!";
    document.getElementById("lsc").textContent = "Gatlak: " + next + " / " + N + " · synanyşyk: " + tries;
  }
  function pick() {
    var i = parseInt(this.getAttribute("data-i"), 10), m = document.getElementById("lmsg");
    tries++;
    if (i === next) {
      next++;
      m.className = "msg ok";
      m.textContent = next === N ? "Tertip dogry!" : ("Dogry! " + LS[next - 1][2]);
    } else {
      m.className = "msg bad";
      m.textContent = "Entek irki: ilki " + LS[next][0] + " gelmeli.";
    }
    draw();
  }
  document.getElementById("lreset").onclick = function () {
    next = 0; tries = 0;
    document.getElementById("lmsg").className = "msg";
    document.getElementById("lmsg").textContent = "";
    draw();
  };
  draw();
})();

var CO = [["Meýdany (ini 150 m)", "v * 150", "m²"], ["Gektarda", "v * 150 / 10000", "ga"], ["Her gektardan 40 s hasyl", "v * 150 / 10000 * 40", "s"]], CU = "m", CL = "Uzynlyk";
(function () {
  var inp = document.getElementById("cinp");
  function upd() {
    var v = parseFloat(inp.value);
    document.getElementById("clab").textContent = CL + ": " + String(v).replace(".", ",") + " " + CU;
    var h = "";
    for (var i = 0; i < CO.length; i++) {
      var r = eval(CO[i][1]);
      r = Math.round(r * 100) / 100;
      h += "<b>" + CO[i][0] + ":</b> " + r + " " + CO[i][2] + "<br>";
    }
    document.getElementById("cout").innerHTML = h.replace(/(\d)\.(\d)/g, "$1,$2");
  }
  inp.oninput = upd;
  upd();
})();

var Q = [["1 gektar näçe kwadrat metre deň?", ["1000 m²", "10 000 m²", "100 000 m²"], 1], ["Çylşyrymly ýer bölegi nähili hasaplanýar?", ["Perimetri boýunça", "Ýönekeý şekillere bölünip", "Diagonaly boýunça"], 1], ["Bölekleriň meýdanlary näme edilýär?", ["Köpeldilýär", "Goşulýar", "Aýrylýar"], 1]];
(function () {
  var qd = 0, qok = 0, h = "";
  for (var i = 0; i < Q.length; i++) {
    h += '<div class="qa"><b>' + (i + 1) + '.</b> ' + Q[i][0] + '<div class="row">';
    for (var j = 0; j < Q[i][1].length; j++)
      h += '<button class="btn" data-q="' + i + '" data-a="' + j + '">' + Q[i][1][j] + '</button>';
    h += '</div><div class="msg" id="qm' + i + '"></div></div>';
  }
  document.getElementById("quiz").innerHTML = h;
  var bs = document.getElementById("quiz").getElementsByTagName("button");
  for (var i = 0; i < bs.length; i++) {
    bs[i].onclick = function () {
      var k = parseInt(this.getAttribute("data-q"), 10), a = parseInt(this.getAttribute("data-a"), 10);
      var m = document.getElementById("qm" + k);
      if (m.getAttribute("data-done")) return;
      m.setAttribute("data-done", "1"); qd++;
      if (a === Q[k][2]) { qok++; m.className = "msg ok"; m.textContent = "Dogry!"; }
      else { m.className = "msg bad"; m.textContent = "Dogry jogap: " + Q[k][1][Q[k][2]]; }
      document.getElementById("qsc").textContent = "Netije: " + qok + " / " + qd;
    };
  }
})();
</script>
</body>
</html>
